<!--
  PROTOTYPE, throwaway. Answers: "What do Look Together's look and the voice of its copy feel like?"
  (wayfinder ticket #54 on map #1). The quiet stack from prototypes/screens (variant A of #47), trimmed to it,
  dressed three ways. The layout is settled, so these variants disagree on type, colour, spacing, icon style,
  app icon and the voice of the app's own words, not on navigation. Switch with ?look=A|B|C, the floating bar,
  or ← / →; light and dark with the bar too.
    A  Paper   : warm paper and ink, serif for what the person reads and writes, soft cards, plain warm voice.
    B  Dusk    : dark-first slate and sage, big rounded sans, lots of air, no borders, spare voice.
    C  Ledger  : white, black, one blue, hairline rules and numbered Probes, literal voice that names the terms.
  Everything is in memory; reload resets. Model replies are canned and the same in every look: only the app's
  own words change.
-->

// ---------- screens ----------
function topbar(title, left = '', right = '') { return `<div class="topbar"><div class="side">${left}</div><div class="title">${title}</div><div class="side r">${right}</div></div>`; }
const backBtn = act => `<button class="iconbtn" data-act="${act}" aria-label="Back">${ic('back')}</button>`;
const helpBtn = () => `<button class="help ${S.helpUsed ? 'used' : ''}" data-act="help">${T().help}</button>`;

function onboarding() {

    <div class="dots">${t.onb.map((_, i) => `<i class="${i === S.onb ? 'on' : ''}"></i>`).join('')}${S.look === 'C' ? `${S.onb + 1} / 4` : ''}</div>
    ${S.onb === 0 ? `<div style="margin-bottom:18px">${LOOKS[S.look].icon(64)}</div>` : ''}
    <h1>${title}</h1><p class="${S.look === 'A' ? 'read' : ''}" style="font-size:1.05em">${b}</p>${foot ? `<p class="small mut" style="margin-top:18px">${foot}</p>` : ''}

      ${S.onb < 3 ? `<button class="pri right" data-act="onbNext">${S.onb === 1 ? t.understand : t.next}</button>` : ''}</div></div>`;
}

function home() {
  const t = T(), live = S.today && S.today.status === 'live';
  const todayBlock = live ? `<div class="card tap" data-act="resume"><p class="small mut">${t.todayLive}</p><p class="probe">${esc(S.today.problem)}</p></div>`

function composer(kind) {

function probeList() {
  const t = T(), i = inq(), all = i.probes.every(p => p.status === 'looked');

}

function pathScreen() {
  const t = T(), p = inq().probes.find(x => x.id === S.path), s = PS[p.id], out = [], q = (h) => `<div class="q">${h}<button class="more" data-act="report" aria-label="Report">${ic('more')}</button></div>`;
  out.push(q(`<span class="probe" style="font:inherit">${s.probe}</span>`));
  if (p.reveal || p.status === 'looked') out.push(`<p class="under">${t.under} ${s.premise}</p>`);
  for (let k = 0; k < p.pos; k++) {
    out.push(`<div class="r">${esc(s.rs[k])}</div>`);
    if (k === 0 && s.offer) out.push(p.offered ? `<p class="small mut">${p.offered === 'yes' ? '✓' : '–'}</p>` : `<div class="offer">${s.offer}<div class="row" style="margin-top:10px"><button class="pri" data-act="offer" data-a="yes">Yes</button><button data-act="offer" data-a="no">No</button></div></div>`);
    if (k + 1 < s.qs.length) out.push(q(s.qs[k + 1]));
  }
  if (p.status === 'looked') out.push(`<div class="closing"><p class="small mut" style="margin-top:0">${t.out[s.outcome]}</p>${s.quote ? `<p class="read">“${s.quote}”</p>` : ''}${s.openq ? `<p class="small mut">${t.oq}</p><p class="read"><b>${s.openq}</b></p>` : ''}</div><p class="small mut center">${t.ended}</p>`);
  else if (p.pos === 0 && !p.reveal) out.push(`<button class="link small" data-act="reveal">${t.notFit}</button>`);
  out.push(`<div class="row" style="margin-top:6px"><button class="link small" data-act="noop" style="color:var(--mut);display:flex;gap:6px;align-items:center">${ic('listen')} listen</button></div>`);
  return topbar(t.path, backBtn('closePath'), helpBtn()) + `<div class="scroll pad narrow">${out.join('')}</div>` + (p.status !== 'looked' ? composer('path') : '');
}

function recapScreen() {

const contacts = () => `<div class="contact"><b>988 Suicide &amp; Crisis Lifeline</b><br><span class="small">Call or text 988 · US</span></div><div class="contact"><b>Crisis Text Line</b><br><span class="small">Text HOME to 741741</span></div><p class="small mut">${T().elsewhere}</p>`;
function stepOut() { const t = T(); return topbar('') + `<div class="scroll pad narrow"><h1>${t.stepT}</h1><p>${t.stepB[0]}</p><p>${t.stepB[1]}</p>${contacts()}<p class="small mut" style="margin-top:16px">${t.stepEnd}</p><button data-act="home" style="margin-top:12px">${t.close}</button></div>`; }

}

function render() {
  const app = document.getElementById('app');
  app.dataset.look = S.look; app.className = (S.dark ? 'dark ' : '') + (S.web ? 'web' : '');

  if (!S.onboarded) h = onboarding();
  else h = { home, problem: problemScreen, inquiry: () => S.path ? pathScreen() : probeList(), recap: recapScreen, stepout: stepOut, limit, settings }[S.screen]();
  app.innerHTML = h + sheets();
  renderSide(); renderProto();
}
function renderSide() {
  const L = LOOKS[S.look];

    <select data-p="jump"><option value="">jump to…</option>${[['onb', 'onboarding'], ['home', 'home'], ['new', 'new Inquiry'], ['probes', 'Probe list, mid-way'], ['path', 'a Path, mid-way'], ['ended', 'an ended Path'], ['recap', 'Recap'], ['help', 'Help sheet'], ['report', 'report sheet'], ['stepout', 'Step-out'], ['limit', 'limit'], ['settings', 'settings']].map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>
    <button data-p="reset">reset</button>`;

// ---------- actions ----------
function newToday(midway) {
  S.today = { problem: PROBLEM, status: 'live', worth: null, probes: ['p1', 'p2', 'p3', 'p4'].map(id => ({ id, status: 'open', pos: 0 })) };
  S.todayDone = true;
  if (midway) { Object.assign(S.today.probes[0], { status: 'looked', pos: 3 }); Object.assign(S.today.probes[1], { status: 'exploring', pos: 1 }); Object.assign(S.today.probes[2], { status: 'looked', pos: 2 }); }
}
function submitReflection() {
  const p = inq().probes.find(x => x.id === S.path), s = PS[p.id];
  if (/hurt myself|end it|kill/i.test(S.draft)) { S.draft = ''; inq().status = 'stepped'; S.screen = 'stepout'; S.path = null; return render(); }
  p.status = 'exploring'; p.pos++; S.draft = '';
  if (p.pos >= s.qs.length) p.status = 'looked';
  render();
}
function jump(v) {
  Object.assign(S, { onboarded: true, sheet: null, path: null });
  if (v === 'onb') Object.assign(S, { onboarded: false, onb: 0 });
  if (v === 'home') S.screen = 'home';
  if (v === 'new') Object.assign(S, { today: null, todayDone: false, screen: 'problem' });
  if (['probes', 'path', 'ended', 'recap', 'help', 'report'].includes(v)) { newToday(true); S.screen = 'inquiry'; }
  if (v === 'path' || v === 'help' || v === 'report') S.path = 'p2';
  if (v === 'ended') S.path = 'p1';
  if (v === 'recap') { S.today.status = 'ended'; S.screen = 'recap'; }
  if (v === 'help') S.sheet = 'help';
  if (v === 'report') S.sheet = 'report';
  if (v === 'stepout' || v === 'limit' || v === 'settings') S.screen = v;
  render();
}
function setLook(l) { S.look = l; const u = new URL(location); u.searchParams.set('look', l); history.replaceState(null, '', u); render(); }
const step = d => { const k = Object.keys(LOOKS); setLook(k[(k.indexOf(S.look) + d + k.length) % k.length]); };

document.addEventListener('input', e => {
  const k = e.target.dataset.draft; if (!k) return;
  if (k === 'problem') S.problemDraft = e.target.value; else S.draft = e.target.value;
  e.target.closest('.composer').querySelector('button.pri').disabled = !e.target.value.trim();
});
document.addEventListener('change', e => {
  const a = e.target.dataset.act;
  if (a === 'reason') { S.reasons = e.target.checked ? [...S.reasons, e.target.value] : S.reasons.filter(r => r !== e.target.value); render(); }
  if (a === 'sendEx') { S.sendEx = e.target.checked; render(); }
  if (e.target.dataset.p === 'jump') jump(e.target.value);
});
document.addEventListener('click', e => {
  const pb = e.target.closest('button[data-p]');
  if (pb) { const p = pb.dataset.p;
    if (p === 'prev') step(-1); if (p === 'next') step(1);
    if (p === 'theme') { S.dark = !S.dark; render(); } if (p === 'web') { S.web = !S.web; render(); }
    if (p === 'reset') { const { look, dark, web } = S; S = seed(); Object.assign(S, { look, dark, web }); render(); }
    return; }
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return;
  e.stopPropagation();
  const a = el.dataset.act, p = () => inq().probes.find(x => x.id === S.path);
  ({
    onbNext: () => { S.onb++; render(); }, onbBack: () => { S.onb--; render(); }, signin: () => { S.onboarded = true; S.screen = 'home'; render(); },
    home: () => { S.screen = 'home'; S.path = null; render(); }, settings: () => { S.screen = 'settings'; render(); },
    start: () => { S.screen = 'problem'; render(); }, fill: () => { S.problemDraft = PROBLEM; render(); },
    submitProblem: () => { newToday(false); S.problemDraft = ''; S.screen = 'inquiry'; render(); },
    resume: () => { S.screen = S.today.status === 'live' ? 'inquiry' : 'recap'; render(); },
    openPath: () => { S.path = el.dataset.pid; S.screen = 'inquiry'; render(); }, closePath: () => { S.path = null; render(); },
    reveal: () => { p().reveal = true; render(); }, offer: () => { p().offered = el.dataset.a; render(); },
    submit: submitReflection, finish: () => { inq().status = 'ended'; S.screen = 'recap'; render(); }, worth: () => { inq().worth = el.dataset.w; render(); },
    mic: () => { S.dictating = !S.dictating; if (!S.dictating) { const add = ' and I don\'t really know why I do it'; if (el.dataset.kind === 'problem') S.problemDraft += add; else S.draft += add; } render(); },
    clear: () => { if (el.dataset.kind === 'problem') S.problemDraft = ''; else S.draft = ''; render(); },
    help: () => { S.sheet = 'help'; S.helpUsed = true; render(); }, report: () => { S.sheet = 'report'; S.reasons = []; S.sendEx = false; render(); },
    sendReport: () => { S.sheet = 'thanks'; render(); }, closeSheet: () => { S.sheet = null; render(); }, noop: () => {},
  }[a] || (() => {}))();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
render();
</script>
