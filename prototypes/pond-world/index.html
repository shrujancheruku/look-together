<title>Pond World Framing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE (throwaway, never merge): answers "How big is the pond world, and how does each screen
  frame it?" (issue #71). Three world models, switchable with the bottom bar (‹ ›, arrow keys, or
  #a / #b / #c):
    A  Shoreline  - one wide world; screens are places along it in stack order; the camera pans.
    B  Hillside   - one tall world; the brook falls from the pond to the pool; the camera descends.
    C  Still pond - one pond, one framing for every screen; nothing travels, only the words change.
  The world is drawn by code at art resolution in the chosen kit's palette (issue #70) and every
  device shows a crop of it at a whole-number scale. Judge size, framing, cropping and moves, not
  how well the trees are drawn. Light shafts and drifting clouds are left out.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Nunito:wght@400;600;700&display=swap">
<style>

    padding-block: 20px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #panel h1 { font: 500 22px/1.2 var(--display); margin: 0 0 6px; text-wrap: balance; }

<script id="engine">
"use strict";
// ================= engine: pure, no DOM =================
// ---------- palette: the chosen kit (issue #70), 12-step full colour, sky 16 ----------
const RAMPS = ["sky", "cloud", "far", "leafA", "leafB", "leafC", "trunk", "grass", "water", "glint", "light", "pad", "flower", "mist", "stone"];
const R = Object.fromEntries(RAMPS.map((n, i) => [n, i]));
const PAL = { steps: 12, sky: 16, chroma: 1, hue: 1 };
const SEASONS = {
  spring: { name: "Spring morning", ramps: {
      sky: { L: [.72, .95], C: [.09, .03], H: [238, 205], fixed: 1 }, cloud: { L: [.80, .99], C: [.035, .008], H: [245, 250], fixed: 1 },
      far: { L: [.62, .76], C: [.05, .04], H: [205, 175] }, leafA: { L: [.36, .80], C: [.08, .14], H: [170, 118] },
      leafB: { L: [.56, .93], C: [.09, .06], H: [352, 380] }, leafC: { L: [.48, .86], C: [.10, .15], H: [150, 108] },
      trunk: { L: [.30, .52], C: [.05, .06], H: [25, 55] }, grass: { L: [.42, .82], C: [.09, .15], H: [160, 112] },
      water: { L: [.52, .80], C: [.06, .05], H: [232, 205], fixed: 1 }, glint: { L: [.86, 1], C: [.03, .005], H: [220, 95], fixed: 1 },
      light: { L: [.86, .99], C: [.05, .03], H: [85, 95], fixed: 1 }, pad: { L: [.38, .80], C: [.09, .15], H: [165, 118] },
      flower: { L: [.62, .95], C: [.11, .05], H: [350, 375] }, mist: { L: [.90, .97], C: [.015, .01], H: [230, 220], fixed: 1 },
      stone: { L: [.40, .84], C: [.02, .03], H: [250, 215] } },
    refl: { L: .70, mix: .22, dark: .02 }, moon: false,
    ink: "#1f2f37", halo: "rgba(246,251,255,.9)", inkBelow: "#1c2a33" },
  autumn: { name: "Autumn evening", ramps: {
      sky: { L: [.24, .80], C: [.07, .13], H: [285, 415], fixed: 1 }, cloud: { L: [.42, .80], C: [.09, .12], H: [320, 410] },
      far: { L: [.30, .40], C: [.05, .05], H: [300, 330] }, leafA: { L: [.38, .80], C: [.12, .16], H: [28, 72] },
      leafB: { L: [.32, .66], C: [.12, .15], H: [12, 38] }, leafC: { L: [.48, .88], C: [.10, .15], H: [58, 98] },
      trunk: { L: [.20, .38], C: [.04, .05], H: [10, 40] }, grass: { L: [.30, .66], C: [.07, .11], H: [45, 85] },
      water: { L: [.16, .34], C: [.04, .05], H: [282, 298], fixed: 1 }, glint: { L: [.72, .97], C: [.09, .03], H: [60, 92], fixed: 1 },
      light: { L: [.84, .99], C: [.06, .03], H: [85, 95], fixed: 1 }, pad: { L: [.26, .58], C: [.05, .09], H: [150, 108] },
      flower: { L: [.55, .90], C: [.10, .05], H: [345, 375] }, mist: { L: [.42, .52], C: [.03, .03], H: [300, 310], fixed: 1 },
      stone: { L: [.22, .54], C: [.02, .03], H: [300, 330] } },
    refl: { L: .25, mix: .35, dark: .06 }, moon: true,
    ink: "#fbeedd", halo: "rgba(29,23,48,.92)", inkBelow: "#f3e6d6" },

function oklch(L, C, h) {
  const a = C * Math.cos(h * Math.PI / 180), b = C * Math.sin(h * Math.PI / 180);
  const l_ = L + .3963377774 * a + .2158037573 * b, m_ = L - .1055613458 * a - .0638541728 * b, s_ = L - .0894841775 * a - 1.291485548 * b;
  const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
  const f = (x) => { x = Math.max(0, Math.min(1, x)); return Math.round(255 * (x <= .0031308 ? 12.92 * x : 1.055 * x ** (1 / 2.4) - .055)); };
  return [f(4.0767416621 * l - 3.3077115913 * m + .2309699292 * s), f(-1.2684380046 * l + 2.6097574011 * m - .3413193965 * s), f(-.0041960863 * l - .7034186147 * m + 1.707614701 * s)];
}
const lerp = (a, b, t) => a + (b - a) * t;
function stepsFor(name) {
  switch (name) {
    case "sky": return PAL.sky; case "glint": return 4; case "light": return 3; case "mist": return 2; case "stone": return 8;
    case "far": return PAL.steps - 2; case "trunk": return 4; default: return PAL.steps;
  }
}
const N = RAMPS.map(stepsFor);
function rampLch(spec, n) {
  const out = [], mid = (spec.H[0] + spec.H[1]) / 2;
  for (let s = 0; s < n; s++) {
    const t = n === 1 ? 1 : s / (n - 1);
    let h = lerp(spec.H[0], spec.H[1], t);
    if (!spec.fixed) h = mid + (h - mid) * PAL.hue;
    out.push([lerp(spec.L[0], spec.L[1], t), lerp(spec.C[0], spec.C[1], t) * PAL.chroma, h]);
  }

}
function rowT([L, C, h], row) {
  if (row === "still") return [L * .88 + .07, C * .7, h];
  if (row === "stepout") return [.5 + (L - .5) * .45, C * .2, h];
  return [L, C, h];

const pack = ([r, g, b]) => (255 << 24 | b << 16 | g << 8 | r) >>> 0;
function makeLUT(season, row) {
  const sea = SEASONS[season], LUT = new Uint32Array(RAMPS.length * 32).fill(0xffff00ff);
  RAMPS.forEach((name, r) => rampLch(sea.ramps[name], N[r]).forEach((c, s) => {

    LUT[code(r, s) + 16] = pack(oklch(...rowT([c[0] * (1 - sea.refl.mix) + sea.refl.L * sea.refl.mix - sea.refl.dark, c[1] * .75, c[2]], row)));
  }));

// ---------- helpers ----------
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bay = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + .5) / 16;

const TR = 65535;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function quant(v, n, x, y) { // rich ordered dithering, as in the chosen kit
  v = clamp(v, 0, 1) * (n - 1);
  const fl = Math.floor(v);
  return clamp(bay(x, y) < v - fl ? fl + 1 : fl, 0, n - 1);
}
const U = 1.25; // feature scale: the kit's trees at 320 art pixels across

// ---------- world building primitives ----------
function newWorld(W, H, seed) {
  return { W, H, land: new Uint16Array(W * H).fill(TR), body: new Uint8Array(W * H), bodies: [null],
    sprites: [], falls: [], glints: [], marks: [], rand: rng(seed) };
}
function farTrees(g, x0, x1, base) {
  const { W, land, rand } = g, nf = N[R.far], top = new Float32Array(W).fill(1e9);
  for (let c = x0 - 12 * U; c < x1 + 12 * U; c += (5 + rand() * 6) * U) {
    const r = (8 + rand() * 9) * U, cy = base - U * (24 + rand() * 16);
    for (let x = Math.max(x0, Math.floor(c - r)); x < Math.min(x1, c + r); x++) top[x] = Math.min(top[x], cy - Math.sqrt(Math.max(0, r * r - (x + .5 - c) ** 2)));
  }
  for (let x = x0; x < x1; x++) for (let y = Math.max(0, Math.round(top[x])); y < base; y++) {
    const d = y - top[x];
    land[y * W + x] = code(R.far, d < 1.5 ? nf - 1 : d < 6 * U ? nf - 2 : 0);
  }
}
function mist(g, x0, x1, base) {
  const { W, land } = g, c = base - 8 * U, hh = 7 * U * 1.4;
  for (let y = Math.max(0, Math.floor(c - hh)); y < base; y++) for (let x = x0; x < x1; x++) {
    const p = (1 - Math.abs(y - c) / hh);

const LEAF = [R.leafA, R.leafA, R.leafC, R.leafB];
function tree(g, cx, cy, Rr, ramp, base) {
  const { W, land, rand } = g, tw = Math.max(1, Math.round(2 * U * Math.max(1, Rr / 30))), nt = N[R.trunk];
  for (let y = Math.round(cy + Rr * .3); y < base - 2; y++) for (let x = Math.round(cx - tw / 2); x < Math.round(cx - tw / 2) + tw; x++)
    if (x >= 0 && x < W && y >= 0) land[y * W + x] = code(R.trunk, x === Math.round(cx - tw / 2) && tw > 1 ? nt - 2 : 0);
  const lobes = [{ x: cx, y: cy, r: Rr * .72, z: Rr * .15 }];
  const m = 6 + Math.floor(rand() * 3);
  for (let j = 0; j < m; j++) { const a = rand() * Math.PI * 2, d = Rr * (.35 + rand() * .25); lobes.push({ x: cx + Math.cos(a) * d * 1.15, y: cy + Math.sin(a) * d * .85, r: Rr * (.4 + rand() * .22), z: 0 }); }
  const bx = Math.floor(cx - Rr * 1.5), by = Math.floor(cy - Rr * 1.3), bw = Math.ceil(Rr * 3), bh = Math.ceil(Rr * 2.6);

    for (let li = 0; li < lobes.length; li++) { const l = lobes[li], dx = bx + x + .5 - l.x, dy = by + y + .5 - l.y, d2 = dx * dx + dy * dy; if (d2 < l.r * l.r) { const z = l.z + Math.sqrt(l.r * l.r - d2); if (z > best) { best = z; bi = li; } } }
    mask[y * bw + x] = bi;
  }
  const nl = N[ramp], inside = (x, y) => x >= 0 && y >= 0 && x < bw && y < bh && mask[y * bw + x] >= 0;
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    const li = mask[y * bw + x];
    if (li < 0) continue;
    const X = bx + x, Y = by + y;
    if (X < 0 || X >= W || Y < 0 || Y >= base) continue;
    const l = lobes[li], dx = (X + .5 - l.x) / l.r, dy = (Y + .5 - l.y) / l.r, nz = Math.sqrt(Math.max(0, 1 - dx * dx - dy * dy));

    v += (hash2(X >> 1, Y >> 1, 5) - .5) * .45;
    v -= Math.max(0, (Y - cy) / Rr) * .35;

    if (!inside(x, y + 1) || !inside(x + 1, y)) s = 0; else if (!inside(x, y - 1) || !inside(x - 1, y)) s = nl - 1;
    land[Y * g.W + X] = code(ramp, s);
  }
}
function treeRow(g, x0, x1, base, o = {}) {
  const sc = o.scale ?? 1, rand = g.rand, inGap = (x, gap) => gap && x > gap[0] && x < gap[1];
  if (o.back !== false) for (let c = x0 - 10 * U; c < x1 + 10 * U; c += 36 * U * sc * (o.dense ?? 1)) {
    const cx = c + rand() * 20 * U * sc, Rr = (18 + rand() * 8) * U * sc;
    if (cx < x0 - 4 || cx > x1 + 4 || inGap(cx, o.gapBack)) continue;

  }
  if (o.front !== false) for (let c = x0; c < x1; c += 54 * U * sc * (o.dense ?? 1)) {
    const cx = c + rand() * 27 * U * sc, Rr = (22 + rand() * 10) * U * sc;
    if (cx > x1 + 4 || inGap(cx, o.gapFront)) continue;
    tree(g, cx, base - 5 * U - Rr * .6 + (o.drop ?? 0), Rr, LEAF[Math.floor(rand() * 4)], base);
  }
}
function bank(g, x0, x1, wy) {

  $("devices").replaceChildren(
    rowEl("View", [chip("One device", !st.compare, () => set("compare", false, true)), chip("All devices", st.compare, () => set("compare", true, true))]),
    rowEl("Phones", DEVICES.filter((d) => d.cls === "phone").map((d) => chip(d.name, !st.compare && st.device === d.id, () => { st.compare = false; set("device", d.id, true); }))),
    rowEl("Bigger", DEVICES.filter((d) => d.cls !== "phone").map((d) => chip(d.name, !st.compare && st.device === d.id, () => { st.compare = false; set("device", d.id, true); }))));
  $("rulesUi").replaceChildren(
    rowEl("Waterline", [["share", "Share of height"], ["top", "Fixed from top", "extra → water"], ["bottom", "Fixed from bottom", "extra → sky"]].map(([k, l, s]) => chip(l, st.anchor === k, () => set("anchor", k), s))),
    rowEl("Big pixels", [["ceil", "Never smaller", "ceil"], ["round", "Nearest", "round"]].map(([k, l, s]) => chip(l, st.big === k, () => set("big", k, true), s))),
    rowEl("Move", [["auto", "Variant's own"], ["pan", "Pan"], ["dissolve", "Dissolve"], ["cut", "Cut"]].map(([k, l]) => chip(l, st.move === k, () => set("move", k)))),
    rowEl("Words", [["travel", "Travel with the world"], ["fade", "Fade over it"]].map(([k, l]) => chip(l, st.words === k, () => set("words", k)))),
    rowEl("Motion", [chip("Reduce Motion", st.reduce, () => set("reduce", !st.reduce))]),
    rowEl("Season", Object.entries(SEASONS).map(([k, s]) => chip(s.name, st.season === k, () => set("season", k, true)))));
  $("show").replaceChildren(rowEl("Layers", [["text", "Words"], ["safe", "Safe areas"], ["kb", "Keyboard"], ["tags", "Landmarks"], ["keyart", "Key-art box"]].map(([k, l]) => chip(l, st[k], () => set(k, !st[k])))));
  renderStats(); renderFramings(); renderRules(); drawMapCams();
}
function renderStats() {
  const g = world(), def = WORLDS[st.v], v = views[0];
  const r = keyArt(g, def, st.screen);
  const lines = [`world      ${g.W} × ${g.H} art px`, `screen     ${SCREEN_LABEL[st.screen]}${st.over !== "none" ? " + " + st.over : ""}`,
    `motion     ${motionMode()} · move ${moveStyle()}`, `waterline  anchor ${st.anchor} at ${def.framings[st.screen].share}`];
  if (v && !st.compare) {
    const c = v.cam || cameraFor(g, def, st.screen, v.d, v.sc), f = def.framings[st.screen];
    lines.push(`device     ${v.d.name}`, `scale      ${v.sc.k} device px per art px${v.sc.k !== v.sc.k0 ? ` (bumped from ${v.sc.k0} to fit the world)` : ""}`,
      `sees       ${v.sc.vw} × ${v.sc.vh} art px`, `camera     x ${c.x}…${c.x + v.sc.vw}, y ${c.y}…${c.y + v.sc.vh}`,
      `waterline  at ${Math.round((f.y - c.y) / v.sc.vh * 100)}% of the height`, `panes      ${panesFor(v.d, st.screen).map((p) => p.type).join(" | ")}`);
  }
  if (r) lines.push(`key art    x ${r.x0}…${r.x1}, y ${r.y0}…${r.y1}  (${r.x1 - r.x0} × ${r.y1 - r.y0}, seen on every phone)`);
  $("stats").textContent = lines.join("\n");
}
function renderFramings() {
  const g = world(), def = WORLDS[st.v];
  let h = `<tr><th>Screen</th><th>Focus</th><th>Waterline</th><th>Key-art box (all phones)</th></tr>`;
  for (const s of SCREENS) {
    const f = def.framings[s], r = keyArt(g, def, s);
    h += `<tr><td>${SCREEN_LABEL[s]}</td><td>${f.x}, ${f.y}</td><td>${Math.round(f.share * 100)}%</td><td>${r ? `${r.x1 - r.x0} × ${r.y1 - r.y0} at ${r.x0}, ${r.y0}` : "-"}</td></tr>`;
  }
  $("frTable").innerHTML = h;
}
function renderRules() {
  const def = WORLDS[st.v], g = world();
  const ph = DEVICES.filter((d) => d.cls === "phone").map((d) => scaleFor(d, g));
  const minW = Math.min(...ph.map((s) => s.vw)), maxW = Math.max(...ph.map((s) => s.vw)), minH = Math.min(...ph.map((s) => s.vh)), maxH = Math.max(...ph.map((s) => s.vh));
  const items = [
    `<b>World:</b> ${def.W} × ${def.H} art pixels, one world drawn once per season; screens are camera rects inside it.`,
    `<b>Phones:</b> an art pixel is round(device width ÷ 320) device pixels, so phones see ${minW}–${maxW} across and ${minH}–${maxH} down. Taller phones see more sky and water, never a wider world.`,
    `<b>Tablets and web:</b> an art pixel is ${st.big === "ceil" ? "ceil" : "round"}(dpr × 1.25) device pixels, about the size it is on a phone, so they see more world, not bigger pixels; if that would show past the world's edge, the pixel grows one step at a time until it fits.`,
    `<b>Waterline:</b> ${st.anchor === "share" ? "at a fixed share of the screen's height per screen" : st.anchor === "top" ? "a fixed distance from the top per screen; taller screens add water" : "a fixed distance from the bottom per screen; taller screens add sky"}; the camera is clamped inside the world.`,
    `<b>Wide web:</b> one camera behind all panes; the focus of the screen goes under the middle of the deepest pane.`,
    `<b>Key art</b> for a screen sits inside the box every phone sees (the dashed box), clear of the status bar and home indicator. The keyboard covers the scene and never moves it.`,
    `<b>Moves:</b> ${moveStyle() === "pan" ? `a pan in whole art pixels, eased, ${st.v === "a" ? "sideways" : "up and down"}, 0.7–1.8 s by distance` : moveStyle() === "dissolve" ? "an eight-step dither dissolve on the art grid, 0.7 s" : "a cut"}; words ${st.words === "travel" ? "travel with the world" : "fade out, then in"}. Under Reduce Motion every move is a dissolve. Help and the Step-out never move the camera; they only change the palette row.`,
  ];
  $("rules").innerHTML = items.map((x) => `<li>${x}</li>`).join("");
}
// the world map
const mapEl = $("map");
let mapBase = null;
function drawMapBase() {
  const g = G, off = document.createElement("canvas");
  off.width = g.W; off.height = g.H;
  const c = off.getContext("2d"), img = c.createImageData(g.W, g.H), pix = new Uint32Array(img.data.buffer), buf = new Uint16Array(g.W * g.H);
  compose(g, 0, 0, g.W, g.H, 0, "still", buf);
  for (let i = 0; i < buf.length; i++) pix[i] = g.LUT.normal[buf[i]];
  c.putImageData(img, 0, 0); mapBase = off;
  $("mapCap").textContent = `${g.W} × ${g.H} art pixels. The accent box is what the chosen device sees; the dashed box is the key-art box for this screen. Thin boxes: every phone.`;
}
let mapKey = "";
function drawMapCams() {
  if (!mapBase) return;
  const g = world(), wmax = Math.max(220, Math.min(368, $("panel").clientWidth - 32)), sc = Math.min(wmax / g.W, 420 / g.H);
  const W = Math.round(g.W * sc), H = Math.round(g.H * sc), v = views[0], cam = v && !st.compare ? v.cam : null;
  const key = [W, H, st.v, st.season, st.screen, st.anchor, st.big, cam && cam.x, cam && cam.y, st.device, st.compare].join();
  if (key === mapKey) return; mapKey = key;
  mapEl.width = W * 2; mapEl.height = H * 2; mapEl.style.width = W + "px"; mapEl.style.height = H + "px";
  const c = mapEl.getContext("2d"); c.setTransform(2, 0, 0, 2, 0, 0); c.imageSmoothingEnabled = true;
  c.drawImage(mapBase, 0, 0, W, H);
  const def = WORLDS[st.v];
  c.lineWidth = .8; c.strokeStyle = "rgba(255,255,255,.55)";
  for (const d of DEVICES) if (d.cls === "phone") { const s2 = scaleFor(d, g), k = cameraFor(g, def, st.screen, d, s2); c.strokeRect(k.x * sc, k.y * sc, s2.vw * sc, s2.vh * sc); }
  const r = keyArt(g, def, st.screen);
  if (r) { c.setLineDash([4, 3]); c.lineWidth = 1.5; c.strokeStyle = "#e9c47e"; c.strokeRect(r.x0 * sc, r.y0 * sc, (r.x1 - r.x0) * sc, (r.y1 - r.y0) * sc); c.setLineDash([]); }
  if (cam) { c.lineWidth = 2; c.strokeStyle = "#e9c47e"; c.strokeRect(cam.x * sc, cam.y * sc, v.sc.vw * sc, v.sc.vh * sc); }
  c.font = "600 10px Nunito, sans-serif"; c.fillStyle = "#fff"; c.strokeStyle = "rgba(0,0,0,.6)"; c.lineWidth = 3;
  for (const m of g.marks) { c.strokeText(m.label, m.x * sc + 3, m.y * sc); c.fillText(m.label, m.x * sc + 3, m.y * sc); }
  renderStats();
}

// ================= switcher =================
const KEYS = Object.keys(WORLDS);
function go(dir) { st.v = KEYS[(KEYS.indexOf(st.v) + dir + KEYS.length) % KEYS.length]; history.replaceState(null, "", "#" + st.v); layout(); }
$("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
$("panelBtn").onclick = () => { const p = $("panel"); p.hidden = !p.hidden; $("panelBtn").setAttribute("aria-expanded", String(!p.hidden)); };
addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1);
});
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (WORLDS[h] && h !== st.v) { st.v = h; layout(); } });
let rT = 0; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(layout, 150); });
if (matchMedia("(max-width: 820px)").matches) { $("panel").hidden = true; $("panelBtn").setAttribute("aria-expanded", "false"); }
layout();
requestAnimationFrame(frame);
</script>
