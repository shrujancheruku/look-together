<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Look Together pond</title>
<!--
  PROTOTYPE, throwaway. "What do Look Together's look and the voice of its copy feel like?" (wayfinder ticket #54
  on map #1), round 4. Brainstorm material, not decisions. Everything floats on one pool in a forest. One rule
  throughout: the app's words sit ABOVE the waterline, the person's BELOW it (always upright).
    - Opening: still sky reflected, a drop falls, the ripples bring up the wordmark.
    - Home: a pond in a forest. Trees sway and drop the odd leaf. Settings is a moored rowboat top left; the
      primary action is a flowering lily pad bottom right, its label written on the pad.
    - An Inquiry is a lily: the Problem is its pad, the Paths its stem, the Recap its flower. Each Inquiry on
      home: an unfinished one is a lily pad that yellows as its 7 days run out; a Recap is the flower alone.
    - Probe list: Probes above, the person's Problem below; Finish Inquiry is the same bottom-right lily pad.
    - Path: a meandering brook runs through the water, babbling round stones, and you walk along it step by step
      (‹ › or swipe). Submitting a Reflection skims a small stone down the brook. An offer to add a Probe floats
      as a bud on the waterline and opens when tapped. The Path never moves when the
      keyboard opens: the keyboard slides over the empty water at the bottom.
    - Recap: the brook quietens and opens into a still pool, and the lily flowers.
    - The AI notice shows once, at the start of each Inquiry (EU AI Act Art. 50); no label on every screen.
    - Help and the Step-out still the water: no motion, no metaphor.
  Logo options (?logo=lily|lilysun|lilyripples). Voice warms along the current Path and when the model signals
  softening ("model: softening" in the bar).
  ANIMATION IS PLACEHOLDER. Smooth, natural, relaxing motion is heavy work for later, as is timing that sits
  between snappy and calm.
  ?jump=home|new|probes|path|pathmid|ended|recap|help|stepout  ?season=morning|evening|auto
  Everything is in memory; reload resets. Phone only.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @property --wl { syntax:'<percentage>'; inherits:true; initial-value:50%; }
  #app.morning { --sky1:#c9dfec; --sky2:#f7efe0; --wat1:#dfe8de; --wat2:#6e97a0; --ink:#1f2e36; --wink:#0e2a31; --mut:#5d6d72; --wmut:#2f5058;
    --glass:rgba(255,255,255,.42); --glassB:rgba(255,255,255,.6); --acc:#4f7a3a; --leaf:#7fa65a; --leafV:#4f7a3a; --drop:#ffffff; --rip:rgba(255,255,255,.75); --still:#9fbcc0; --shade:rgba(20,50,60,.28);
    --creek:#f4fbf8; --pad:#5d8f45; --padR:#3f6e30; --stone:#a7aaa2; --stoneT:#c4c6bd; }
  #app.evening { --sky1:#1e1a32; --sky2:#c07a4c; --wat1:#6a4a44; --wat2:#14142a; --ink:#f4eadc; --wink:#f1e5d4; --mut:#cdbfae; --wmut:#cdb9a6;
    --glass:rgba(24,20,44,.42); --glassB:rgba(255,220,180,.18); --acc:#e09a5c; --leaf:#c8692e; --leafV:#7d3a17; --drop:#ffe6c8; --rip:rgba(255,214,170,.55); --still:#2a2638; --shade:rgba(0,0,0,.4);
    --creek:#ffd9b0; --pad:#6f6a2c; --padR:#4c4a1c; --stone:#5d5a63; --stoneT:#77737d; }

  * { box-sizing:border-box; }
  body { margin:0; background:#b9b9b4; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; gap:24px; padding:16px 16px 150px; font:13px system-ui,sans-serif; }
  #app { --wl:50%; position:relative; overflow:hidden; width:390px; max-width:100%; height:800px; flex:none; border-radius:34px; box-shadow:0 8px 40px #0003;
    font:15px/1.5 "Inter",system-ui,sans-serif; color:var(--ink); transition:--wl .9s cubic-bezier(.4,.1,.2,1); }
  .sky { position:absolute; inset:0 0 auto 0; height:var(--wl); background:linear-gradient(var(--sky1),var(--sky2)); }
  .water { position:absolute; inset:var(--wl) 0 0 0; background:linear-gradient(var(--wat1),var(--wat2)); overflow:hidden; }
  .water::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(transparent 0 7px, rgba(255,255,255,.05) 7px 8px); }
  /* the brook: a meandering band with currents and babbling stones, walked along step by step */
  .creek { position:absolute; left:0; top:0; opacity:0; transition:opacity 1.6s ease; pointer-events:none; }
  #creekg { transition:transform 1.4s cubic-bezier(.4,.1,.2,1); }
  .creek .babble { transform-box:fill-box; transform-origin:center; animation:ringout 3.2s ease-out infinite; opacity:0; }
  .wline { position:absolute; left:0; right:0; top:var(--wl); height:1px; background:var(--rip); opacity:.7; }
  #rip { position:absolute; inset:0; pointer-events:none; z-index:3; }
  #ui { position:absolute; inset:0; }
  .layer { position:absolute; inset:0; z-index:4; display:flex; flex-direction:column; }
  .above { height:var(--wl); display:flex; flex-direction:column; min-height:0; }
  .below { flex:1; min-height:0; display:flex; flex-direction:column; color:var(--wink); }
  .scroll { overflow-y:auto; min-height:0; flex:1; scrollbar-width:thin; scrollbar-color:var(--glassB) transparent; }
  .pad { padding:12px 22px; }
  .read { font-family:"Newsreader",Georgia,serif; }
  .mut { color:var(--mut); } .below .mut { color:var(--wmut); } .small { font-size:13px; }
  p { margin:6px 0; } h1 { font:500 26px/1.2 "Newsreader",serif; margin:4px 0 6px; }
  h3 { font:500 12px/1 "Inter",sans-serif; letter-spacing:.08em; text-transform:uppercase; margin:20px 0 10px; color:var(--mut); }
  .below h3 { color:var(--wmut); }
  button { font:inherit; cursor:pointer; color:inherit; background:var(--glass); border:1px solid var(--glassB); border-radius:22px; padding:9px 16px; backdrop-filter:blur(6px); }
  button.pri { background:var(--ink); color:var(--sky2); border-color:var(--ink); }
  #app.evening button.pri { background:var(--acc); color:#1e1a32; border-color:var(--acc); }
  button.link { background:none; border:none; padding:4px 0; backdrop-filter:none; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; }
  button:disabled { opacity:.4; }
  .row { display:flex; gap:10px; align-items:center; } .grow { flex:1; } .right { margin-left:auto; } .center { text-align:center; }
  .topbar { display:flex; align-items:center; padding:46px 14px 2px; min-height:80px; flex:none; }
  .topbar .s { flex:1; display:flex; } .topbar .s.r { justify-content:flex-end; }
  .back { background:none; border:none; backdrop-filter:none; padding:6px 4px; display:flex; align-items:center; gap:2px; font-size:14px; }
  .help { background:none; border:none; padding:6px 2px; backdrop-filter:none; font-weight:500; font-size:14px; display:flex; gap:6px; align-items:center; }
  .help::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--acc); }
  .card { background:var(--glass); border:1px solid var(--glassB); border-radius:16px; padding:13px 16px; margin:9px 0; backdrop-filter:blur(6px); }
  .card.tap { cursor:pointer; }
  .float { animation:bob 7s ease-in-out infinite; } .float:nth-child(2n) { animation-delay:-2.5s; } .float:nth-child(3n) { animation-delay:-4.8s; }
  @keyframes bob { 50% { transform:translateY(3px) rotate(-.3deg); } }
  #app.still .float, #app.still .pobj .bobber, #app.still .pobj .ring, #app.still .sway, #app.still .creek .babble { animation:none !important; }
  .badge { font:italic 14px "Newsreader",serif; white-space:nowrap; }

  /* forest behind the wordmark, and its reflection */
  .trees { position:absolute; left:0; right:0; z-index:2; pointer-events:none; }
  .trees.top { top:calc(var(--wl) - 130px); height:130px; }
  .trees.refl { top:var(--wl); height:130px; transform:scaleY(-1); opacity:.22; filter:blur(1.5px); }
  .sway { transform-box:fill-box; transform-origin:50% 100%; animation:sway 6s ease-in-out infinite alternate; }
  @keyframes sway { from { transform:rotate(-1.4deg); } to { transform:rotate(1.6deg) skewX(1deg); } }
  .flyer { position:absolute; z-index:5; pointer-events:none; }

  /* things found on a pond, used as the two controls */
  .pobj { position:absolute; z-index:6; background:none; border:none; padding:0; backdrop-filter:none; display:flex; flex-direction:column; align-items:center; }
  .pobj .body { position:relative; display:grid; place-items:center; }
  .pobj .bobber { position:relative; z-index:2; animation:pbob 6.5s ease-in-out infinite; display:grid; place-items:center; }
  .pobj.boat .bobber { animation-name:rock; animation-duration:5s; }
  .pobj.stones .bobber { animation:none; }
  .pobj .shadow { position:absolute; inset:35% 4% 0 8%; background:radial-gradient(ellipse at 50% 50%, var(--shade), transparent 70%); filter:blur(3px); transform:translate(2px,6px); }
  .pobj .ring { position:absolute; left:50%; top:62%; width:116%; height:50%; margin:-25% 0 0 -58%; border:1px solid var(--rip); border-radius:50%; opacity:0; animation:ringout 6s ease-out infinite; }
  .pobj .ring.r2 { animation-delay:-3s; }
  @keyframes pbob { 0%,100% { transform:translateY(0) rotate(0); } 40% { transform:translateY(1.5px) rotate(.8deg); } 75% { transform:translateY(-1px) rotate(-.6deg); } }
  @keyframes rock { 0%,100% { transform:rotate(-2deg) translateY(0); } 50% { transform:rotate(2deg) translateY(1.5px); } }
  @keyframes ringout { 0% { transform:scale(.7); opacity:.55; } 100% { transform:scale(1.7); opacity:0; } }
  .pobj .on { position:absolute; inset:0; display:grid; place-items:center; z-index:3; pointer-events:none; font:600 15px/1.1 "Inter",sans-serif; color:#fbf6ea; text-shadow:0 1px 3px rgba(0,0,0,.45); white-space:nowrap; }
  .pobj.stones .on { color:#2f2f2c; text-shadow:0 1px 0 rgba(255,255,255,.5); font-weight:600; }
  #app.evening .pobj.stones .on { color:#f2ece4; text-shadow:0 1px 0 rgba(0,0,0,.5); }
  .pobj .under { font-size:12px; color:var(--wink); text-shadow:0 1px 3px rgba(0,0,0,.25); margin-top:2px; font-style:normal; }
  .pobj.dry { opacity:.75; } .pobj.dry .ring { display:none; }
  .leafnote { position:absolute; right:20px; bottom:130px; z-index:7; width:230px; }

  /* Path halves */
  .q { font:400 22px/1.4 "Newsreader",serif; }
  .r { font:400 18px/1.5 "Newsreader",serif; }
  .premise { font:italic 15px "Newsreader",serif; color:var(--wmut); margin-bottom:10px; }
  .stepnav { position:absolute; left:0; right:0; top:calc(var(--wl) - 17px); z-index:6; display:flex; align-items:center; padding:0 8px; pointer-events:none; }
  .stepnav button { pointer-events:auto; background:var(--glass); width:34px; height:34px; padding:0; border-radius:50%; display:grid; place-items:center; }
  .dotsrow { flex:1; display:flex; justify-content:center; gap:7px; }
  .dotsrow i { width:6px; height:6px; border-radius:50%; background:var(--rip); opacity:.5; } .dotsrow i.on { opacity:1; transform:scale(1.4); }
  .dotsrow i.end { border-radius:1px; transform:rotate(45deg); } .dotsrow i.end.on { transform:rotate(45deg) scale(1.4); }
  .fromR { animation:fromR .7s ease both; } .fromL { animation:fromL .7s ease both; }
  @keyframes fromR { from { opacity:0; transform:translateX(28px); } } @keyframes fromL { from { opacity:0; transform:translateX(-28px); } }
  textarea.ref { width:100%; height:150px; background:none; border:none; outline:none; resize:none; color:var(--wink); font:18px/1.5 "Newsreader",serif; padding:0; }
  textarea.ref::placeholder { color:var(--wmut); }
  .ctrl { display:flex; align-items:center; gap:10px; padding:6px 22px 0; }
  .kbd { transform:translateY(100%); transition:transform .32s cubic-bezier(.3,.7,.3,1); display:grid !important; }
  #app.kb .kbd { transform:none; }
  .skim { position:absolute; z-index:3; width:7px; height:3px; border-radius:50%; background:#5f615b; opacity:.85; }
  .stage { flex:none; display:block; }
  .bud { position:absolute; z-index:7; left:70%; top:calc(var(--wl) - 26px); background:none; border:none; padding:0; backdrop-filter:none; animation:pbob 4.5s ease-in-out infinite; }
  .bud::after { content:""; position:absolute; left:-6px; right:-6px; bottom:-3px; height:8px; border:1px solid var(--rip); border-radius:50%; opacity:.5; }
  .budcard { position:absolute; z-index:9; right:14px; width:270px; bottom:calc(100% - var(--wl) + 34px); font-size:14px; }
  .ailabel { font-variant:small-caps; letter-spacing:.06em; font-size:13px; }
  .mic { width:42px; height:42px; padding:0; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .mic.on { background:var(--acc); }
  svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .offer { margin-top:10px; font-size:14px; }

  .pair { margin:4px 0 18px; }
  .pair .pq { font:400 17px/1.4 "Newsreader",serif; padding:0 0 8px; }
  .pair .pl { height:1px; background:var(--rip); opacity:.8; }
  .pair .pr { font:400 16px/1.5 "Newsreader",serif; padding:8px 12px 10px; background:linear-gradient(rgba(110,151,160,.35),transparent); }
  #app.evening .pair .pr { background:linear-gradient(rgba(106,74,68,.5),transparent); }

  .fadein { animation:fade 1.1s ease both; } @keyframes fade { from { opacity:0; transform:translateY(-6px); } }
  .rise { animation:rise 1.1s ease both; } @keyframes rise { from { opacity:0; transform:translateY(14px); } }
  .drop { position:absolute; left:50%; width:9px; height:13px; margin-left:-4px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; background:var(--drop); z-index:8; top:-20px; box-shadow:0 0 6px var(--drop); }

  .mark { position:absolute; left:0; right:0; top:calc(var(--wl) - 80px); height:160px; z-index:5; display:flex; justify-content:center; }
  .mark .lk, .mark .tg { opacity:0; transition:opacity 1.4s ease; } .mark.show .lk { opacity:1; } .mark.show .tg { opacity:.62; transition-delay:.5s; }
  .hint { position:absolute; bottom:60px; left:0; right:0; text-align:center; color:var(--wmut); opacity:0; transition:opacity 1s 2.2s; z-index:5; } .mark.show ~ .hint { opacity:1; }

  .scrim { position:absolute; inset:0; z-index:20; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; }
  .sheet { background:var(--still); color:var(--ink); width:100%; border-radius:24px 24px 0 0; padding:18px 22px 30px; }
  #app.evening .sheet { color:var(--wink); }
  .contact { background:var(--glass); border-radius:12px; padding:12px 14px; margin:8px 0; }
  .plain { position:absolute; inset:0; z-index:20; background:var(--still); padding:70px 24px 24px; }
  #app.evening .plain { color:var(--wink); }

  .kbd { position:absolute; left:0; right:0; bottom:0; height:280px; background:#d1d3d9; z-index:30; padding:8px 4px; grid-template-columns:repeat(10,1fr); grid-auto-rows:44px; gap:8px 5px; }
  #app.evening .kbd { background:#2b2b2f; }
  .kbd b { background:#fff; border-radius:5px; box-shadow:0 1px 0 #888; } #app.evening .kbd b { background:#555; }
  .kbd .done { grid-column:span 3; font:500 14px system-ui; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#123; }
  #app.evening .kbd .done { color:#eee; }

  #side { width:320px; flex:none; color:#222; }
  #side .box { background:#f4f4f2; border-radius:12px; padding:14px; margin-bottom:12px; line-height:1.45; }
  #side h4 { margin:0 0 8px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#666; }
  #side .logos { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #side .logos > div { border-radius:10px; overflow:hidden; cursor:pointer; outline:2px solid transparent; } #side .logos > div.on { outline-color:#6a5; }
  #side .logos span { display:block; font-size:11px; color:#555; padding:3px 6px; background:#fff; }
  @media (max-width:760px) { #side { display:none; } }
  #proto { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); background:#111; color:#fff; border-radius:16px; padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font:12px/1.3 ui-monospace,Menlo,monospace; z-index:100; box-shadow:0 4px 20px #0006; max-width:calc(100vw - 24px); }
  #proto button, #proto select { background:#333; color:#fff; border:1px solid #555; border-radius:8px; padding:4px 8px; font:inherit; }
  #proto button.on { background:#6a5; border-color:#8c7; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="wave"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.09" numOctaves="1" seed="3"/><feDisplacementMap id="wavemap" in="SourceGraphic" scale="0"/></filter>
  <filter id="softwave"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.12" numOctaves="1" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.5"/></filter></svg>
<div id="app"><div class="sky"></div><div class="water" id="water"></div><div class="wline"></div><canvas id="rip" width="390" height="800"></canvas><div id="ui"></div></div>
<div id="side"></div>
<div id="proto"></div>
<script>
// ---------- art: leaves, trees, pond objects ----------
const LEAF = (w, rot = 0, fill = 'var(--leaf)') => `<svg width="${w}" height="${w * .62}" viewBox="0 0 50 31" style="transform:rotate(${rot}deg)"><path d="M3 28C8 10 24 2 47 3C44 19 30 30 3 28Z" fill="${fill}"/><path d="M5 27C18 19 30 12 44 5" stroke="var(--leafV)" stroke-width="1.3" fill="none"/></svg>`;
const CROWNS = { morning: ['#7fae5c', '#93c06a', '#5f9446', '#a9cc7a'], evening: ['#c8692e', '#d9913a', '#a4471f', '#e0b04a'] };
const TREES = [[-6, 130, 1.15, 0], [42, 130, .9, 0], [88, 130, .65, .6], [126, 130, .45, 1], [264, 130, .5, 1], [302, 130, .75, .6], [340, 130, 1.05, 0], [386, 130, .85, 0]];
function forest(sn) {
  const cs = CROWNS[sn], trunk = sn === 'evening' ? '#3a2522' : '#5a4636';
  return `<svg viewBox="0 0 390 130" width="390" height="130" preserveAspectRatio="none">${TREES.map(([x, y, s, far], n) => {
    const c = k => cs[(n + k) % cs.length], h = 62 * s, r = 24 * s;
    const blossom = sn === 'morning' && !far ? [0, 1, 2].map(k => `<circle cx="${x + (k - 1) * r * .6}" cy="${y - h - r * .6 + k * 6}" r="${2.2 * s}" fill="#f4c9d2"/>`).join('') : '';
    return `<g class="sway" style="animation-duration:${5 + (n % 3) * 1.3}s;animation-delay:-${n * .9}s;opacity:${1 - far * .45}">
      <rect x="${x - 3 * s}" y="${y - h}" width="${6 * s}" height="${h}" fill="${trunk}"/>
      <circle cx="${x}" cy="${y - h - r * .4}" r="${r}" fill="${c(0)}"/><circle cx="${x - r * .75}" cy="${y - h + r * .3}" r="${r * .8}" fill="${c(1)}"/>
      <circle cx="${x + r * .75}" cy="${y - h + r * .25}" r="${r * .85}" fill="${c(2)}"/><circle cx="${x + r * .1}" cy="${y - h - r * 1.2}" r="${r * .7}" fill="${c(3)}"/>${blossom}</g>`; }).join('')}</svg>`;
}
// a lily pad seen at an angle: a disc with its notch, squashed by perspective
const PAD_PATH = 'M50 50L94.4 38.1A46 46 0 1 0 94.4 61.9Z';
const lilyPad = (w, fill = 'var(--pad)', rim = 'var(--padR)') => `<svg width="${w}" height="${w * .46}" viewBox="0 0 100 100" preserveAspectRatio="none">
  <path d="${PAD_PATH}" fill="${fill}" stroke="${rim}" stroke-width="2.5"/>${[200, 150, 250, 110, 290].map(a => `<line x1="50" y1="50" x2="${50 + 40 * Math.cos(a * Math.PI / 180)}" y2="${50 + 40 * Math.sin(a * Math.PI / 180)}" stroke="${rim}" stroke-width="1.2" opacity=".6"/>`).join('')}</svg>`;
const lotus = (w, open) => `<svg width="${w}" height="${w * .8}" viewBox="0 0 40 32">${(open ? [-60, -30, 0, 30, 60] : [-25, 0, 25]).map(a => `<ellipse cx="20" cy="${open ? 18 : 16}" rx="5" ry="${open ? 13 : 14}" fill="#f6c3cf" stroke="#e38ba2" stroke-width=".8" transform="rotate(${a} 20 30)"/>`).join('')}${open ? '<circle cx="20" cy="24" r="3" fill="#f1cf5b"/>' : ''}</svg>`;
const rowboat = w => `<svg width="${w}" height="${w * .5}" viewBox="0 0 90 45">
  <line x1="18" y1="24" x2="2" y2="40" stroke="#6b4a2c" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="2" cy="40" rx="5" ry="2" fill="#6b4a2c"/>
  <path d="M4 16Q45 30 86 16L78 32Q45 42 12 32Z" fill="#9a6a3e"/><path d="M4 16Q45 26 86 16" stroke="#5e3a20" stroke-width="3" fill="none"/>
  <path d="M10 18Q45 28 80 18L76 22Q45 30 14 22Z" fill="#6f4628"/><rect x="40" y="20" width="10" height="4" rx="1" fill="#b5875a"/>
  <line x1="62" y1="22" x2="84" y2="38" stroke="#6b4a2c" stroke-width="2.5" stroke-linecap="round"/></svg>`;
const stone = (w, h) => `<svg width="${w}" height="${h}" viewBox="0 0 100 40" preserveAspectRatio="none"><ellipse cx="50" cy="22" rx="48" ry="17" fill="var(--stone)"/><ellipse cx="48" cy="18" rx="44" ry="13" fill="var(--stoneT)"/></svg>`;

// an Inquiry is a lily: its pad is the Problem, and it yellows as its 7 days run out; a Recap is the flower alone
const padAge = d => d >= 5 ? ['var(--pad)', 'var(--padR)'] : d >= 3 ? ['#a59a3c', '#7d7428'] : ['#8a6a3a', '#634a26'];
const padGlyph = (days = 7, w = 30) => { const [f, r] = padAge(days);
  return `<svg class="stage" width="${w}" height="${w * .62}" viewBox="0 0 100 62"><g transform="translate(2 4) scale(.96 .56)"><path d="${PAD_PATH}" fill="${f}" stroke="${r}" stroke-width="3"/></g></svg>`; };

// ---------- logos: each draws "Look" above a waterline and "Together" upright below it ----------
const PAL = { morning: { ink: '#1f2e36', line: '#ffffff', sun: '#f0bf5e', pad: '#5d8f45', padR: '#3f6e30', rip: '#ffffff' }, evening: { ink: '#f4eadc', line: '#ffd6aa', sun: '#f6e6c8', pad: '#7d7a34', padR: '#4c4a1c', rip: '#ffd9b0' } };
const TG = (c, still) => `<g class="tg" ${still ? 'style="opacity:.62"' : ''} filter="url(#${still ? 'softwave' : 'wave'})"><text x="108" y="124" font-family="Newsreader,serif" font-size="40" fill="${c.ink}">Together</text></g>`;
const LOOK = (c, still, art) => `<g class="lk" ${still ? 'style="opacity:1"' : ''}>${art}<text x="108" y="66" font-family="Newsreader,serif" font-size="48" fill="${c.ink}">Look</text></g>`;
// a lily on the waterline: the pad seen at an angle, the flower above it, its reflection faint below
const lotusPetals = (cx, by, k, o = 1) => [-62, -31, 0, 31, 62].map(a => `<ellipse cx="${cx}" cy="${by - 11 * k}" rx="${4.6 * k}" ry="${11.5 * k}" fill="#f6c3cf" stroke="#e38ba2" stroke-width="${.8 * k}" opacity="${o}" transform="rotate(${a} ${cx} ${by})"/>`).join('') + `<circle cx="${cx}" cy="${by - 3 * k}" r="${3 * k}" fill="#f1cf5b" opacity="${o}"/>`;
const padAt = (c, cx, y, w) => `<g transform="translate(${cx - w / 2} ${y - w * .12}) scale(${w / 100} ${w * .24 / 100})"><path d="${PAD_PATH}" fill="${c.pad}" stroke="${c.padR}" stroke-width="4"/></g>`;
let RID = 0;
// the flower's reflection: the lotus flipped below the pad (never over it), squashed, and cut into bands that the
// water shifts a little sideways and fades, so it reads as a rippled reflection of the same shape
function lotusReflection(cx, y, k) {
  const id = 'rf' + (++RID), by = y - 2 * k, yb = y + 7 * k, h = 18 * k, n = 5, bh = h / n;
  const shifts = [0, 1.8, -1.4, 2.2, -1.8], ops = [.5, .4, .3, .2, .12];

    + shifts.map((dx, i) => `<g clip-path="url(#${id}${i})" opacity="${ops[i]}"><g transform="translate(${dx * k} ${yb}) scale(1 -.72) translate(0 ${-by})">${lotusPetals(cx, by, k)}</g></g>`).join('');

const rippleArt = (c, cx, y, k) => [38, 50].map((r, n) => `<ellipse cx="${cx}" cy="${y}" rx="${r * k}" ry="${r * .24 * k}" fill="none" stroke="${c.rip}" stroke-width="${.6 * k}" opacity="${.32 - n * .14}"/>`).join('');
const LOGOS = {
  lily: { name: 'Lily on the water', mark: (c, still) => LOOK(c, still, '') + `<line x1="20" y1="80" x2="280" y2="80" stroke="${c.line}" stroke-opacity=".7"/>` + lilyArt(c, 64, 80, 1) + TG(c, still),

const IC = { back: '<path d="M15 5l-7 7 7 7"/>', l: '<path d="M15 5l-7 7 7 7"/>', r: '<path d="M9 5l7 7-7 7"/>', mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',

// ---------- the brook: a long meander, with currents that follow it and stones it babbles round ----------
const CW = 2600, cy = x => 210 + 70 * Math.sin(x / 210) + 26 * Math.sin(x / 83 + 1.3);
const cpath = (dy = 0, wob = 0) => 'M' + Array.from({ length: CW / 20 + 1 }, (_, k) => { const x = k * 20; return `${x} ${(cy(x) + dy + wob * Math.sin(x / 37 + dy)).toFixed(1)}`; }).join(' L');
function creekSvg() {
  const lanes = [[-34, '10 44', 5200], [-17, '22 60', 3900], [0, '14 36', 3300], [16, '26 52', 4300], [33, '8 40', 5600]];
  const rocks = [170, 470, 760, 1080, 1390, 1700, 2010, 2320].map((x, k) => [x, cy(x) + (k % 2 ? 22 : -20), 9 + (k % 3) * 4]);
  return `<svg class="creek" id="creek" width="${CW}" height="560"><g id="creekg">

// ---------- data ----------
const PS = {

const SAMPLE = 'I think I\'m scared that if I stop being the reliable one, nobody will need me.';
function seed() {

const probe = () => inq().probes.find(p => p.id === S.path);
function steps(p) { const s = PS[p.id], n = p.status === 'looked' ? s.qs.length : p.pos + 1;

// ---------- screens: each returns { wl, above, below, extra } ----------

  const vi = Math.min(S.vi, last), cur = st[vi], writing = !looked && vi === st.length - 1, mv = S.dir === 'next' ? 'fromR' : S.dir === 'prev' ? 'fromL' : '';
  const nav = `<div class="stepnav"><button data-act="prev" ${vi ? '' : 'disabled'} aria-label="Previous step">${ic('l')}</button>
    <div class="dotsrow">${st.map((_, k) => `<i class="${k === vi ? 'on' : ''}"></i>`).join('')}${looked ? `<i class="end ${vi === st.length ? 'on' : ''}"></i>` : ''}</div>
    <button data-act="next" ${vi < last ? '' : 'disabled'} aria-label="Next step">${ic('r')}</button></div>`;

  const root = `<button class="pri" data-act="closePath">${W.toProbes()}</button>`;
  const head = topbar(backBtn('closePath', 'Probes'), helpBtn());
  if (S.readAll) return { wl: '12%', above: topbar(backBtn('closeRead', 'Path'), helpBtn()),

  if (looked && vi === st.length) // the closing view: what the app hands back above, the person's own words below, and the way back to the root
    return { wl: '36%', above: `${head}<div class="pad grow ${mv}" style="display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:26px"><p class="small mut" style="margin:0">Looked at · ${W.outcome(s.outcome)}</p>
      ${s.openq ? `<p class="small mut" style="margin-top:10px">Open Question</p><p class="q">${s.openq}</p>` : `<p class="q mut" style="font-size:17px">${s.premise}</p>`}</div>`,

  const offer = vi === 1 && s.offer && p.offered ? `<p class="small mut" style="margin:6px 0 0">${p.offered === 'yes' ? 'Added to your Probes.' : 'Left out.'}</p>` : '';
  // an offer to add a Probe floats as a bud on the waterline, and opens when tapped
  const bud = vi === 1 && s.offer && !p.offered ? `<button class="bud" data-act="bud" aria-label="Another Probe might be here">${budGlyph()}</button>
    ${S.budOpen ? `<div class="card budcard fadein">${s.offer}<div class="row" style="margin-top:8px"><button class="pri" data-act="offer" data-a="yes">Add it</button><button data-act="offer" data-a="no">Not now</button></div></div>` : ''}` : '';
  return { wl: '36%', // fixed, so the keyboard never moves anything
    above: `${head}<div class="pad grow ${mv}" style="display:flex;flex-direction:column;padding-bottom:26px;overflow-y:auto;min-height:0"><div style="margin-top:auto">
      <div class="row" style="align-items:flex-start"><p class="q grow ${S.justReplied ? 'fadein' : ''}" style="margin:0">${cur.q}</p><button class="back mut" data-act="noop" aria-label="Report">${ic('more')}</button></div>${offer}
      ${writing && vi === 0 && !p.reveal && !p.pending ? `<button class="link small mut" data-act="reveal" style="align-self:flex-start">${W.notFit()}</button>` : ''}</div></div>`,
    below: (vi === 0 && p.reveal ? `<div class="pad rise" style="padding-bottom:0;padding-top:22px"><p class="premise">${W.under()} ${s.premise}</p></div>` : '')
      + (p.pending ? `<div class="pad" style="padding-top:26px"><p class="r">${esc(p.pending)}</p><p class="small mut">${W.waiting()}</p></div>`
        : writing ? writeHalf('path') : `<div class="pad ${mv}" style="padding-top:26px"><p class="r">${esc(cur.r)}</p>${read}</div>`),
    extra: nav + bud };
}
function recap() {
  const i = inq(), looked = i.probes.filter(p => p.status === 'looked'), notYet = i.probes.filter(p => p.status !== 'looked'), oqs = looked.map(p => PS[p.id].openq).filter(Boolean);
  return { wl: '22%',
    above: `${topbar(backBtn('home', 'Home'), helpBtn())}<div class="pad row" style="padding-top:0;align-items:flex-end">${flowerGlyph(40)}<div><p class="small mut" style="margin:0">Recap · Tue 3 Nov</p><p class="read" style="font-size:19px;margin:0">What you looked at</p></div></div>`,
    below: `<div class="scroll pad" style="padding-top:18px">
      ${looked.map(p => `<div class="pair"><div class="pq" style="color:var(--wink)">${PS[p.id].premise} <span class="small" style="opacity:.75">· ${W.outcome(PS[p.id].outcome)}</span></div><div class="pl"></div>${PS[p.id].quote ? `<div class="pr">“${PS[p.id].quote}”</div>` : '<div class="pr" style="opacity:.6">—</div>'}</div>`).join('')}
      ${oqs.length ? `<h3>Open Questions</h3>${oqs.map(q => `<div class="card float row">${LEAF(22, -10)}<p class="read grow" style="margin:0;font-size:17px">${q}</p></div>`).join('')}` : ''}
      ${notYet.length ? `<h3>Not looked at yet</h3>${notYet.map(p => `<p style="opacity:.75">${PS[p.id].probe}</p>`).join('')}` : ''}
      <h3>Was this worth your time?</h3><div class="row">${['Yes', 'Not sure', 'No'].map(w => `<button class="${i.worth === w ? 'pri' : ''}" data-act="worth" data-w="${w}">${w}</button>`).join('')}</div>
      <div style="height:40px"></div></div>` };
}
function settingsScreen() {
  return { wl: '13%', above: topbar(backBtn('home', 'Home')), below: `<div class="scroll pad" style="padding-top:16px">${['Region: United States', 'Season: follows the time of day', 'Crash reports: on', 'Export all', 'Import', 'Sent reports', 'About Look Together', 'Privacy', 'Sign out'].map(l => `<div class="card" style="margin:6px 0">${l}</div>`).join('')}</div>` };
}
const contacts = `<div class="contact"><b>988 Suicide &amp; Crisis Lifeline</b><br><span class="small">Call or text 988 · US</span></div><div class="contact"><b>Crisis Text Line</b><br><span class="small">Text HOME to 741741</span></div><p class="small">Somewhere else? findahelpline.com</p>`;

// ---------- render ----------
let lastScreen = null;
function render() {
  const app = document.getElementById('app');
  app.className = season() + (S.still || S.sheet || S.screen === 'stepout' ? ' still' : '') + (S.kb ? ' kb' : '');
  let sc;
  if (S.screen === 'stepout') sc = { wl: '100%', above: '', below: '', extra: `<div class="plain"><h1>Let's stop here.</h1><p>This is an AI, and it can't help with this the way a person can. It isn't a crisis service.</p><p>If you might be in danger, please reach out now:</p>${contacts}<p class="small" style="margin-top:14px">This Inquiry won't carry on.</p><button data-act="home" style="margin-top:10px">Close</button></div>` };
  else sc = { splash, home, problem, probes, path, recap, settings: settingsScreen }[S.screen]();
  S.sc = sc;
  app.style.setProperty('--wl', sc.wl);
  const sheet = S.sheet === 'help' ? `<div class="scrim"><div class="sheet"><h1 style="font-size:22px">Paused</h1><p>Nothing is lost. If you'd like to talk to someone now:</p>${contacts}<button class="pri" data-act="closeSheet" style="width:100%;margin-top:8px">Back to my Inquiry</button></div></div>` : '';
  document.getElementById('ui').innerHTML = `<div class="layer"><div class="above">${sc.above}</div><div class="below">${sc.below}</div></div>${sc.extra || ''}${sheet}
    <div class="kbd">${'<b></b>'.repeat(27)}<span class="done kbdone">done</span></div>`;
  if (S.screen === 'splash' && lastScreen !== 'splash') playSplash();
  // the water: a brook along a Path, quietening into a pool at the Recap, still everywhere else
  if (S.screen !== lastScreen) brookTo(S.screen === 'path' ? 1 : 0, S.screen === 'recap' ? 4500 : 1400);
  if (S.screen === 'path') walkBrook(S.vi);
  if (S.screen === 'home') startLeafFall();
  lastScreen = S.screen; S.justReplied = false; S.dir = null;
  renderSide(); renderProto();
}
function renderSide() {
  const sn = season(), bg = sn === 'evening' ? '#1e1a32,#c07a4c 50%,#6a4a44 50%,#14142a' : '#c9dfec,#f7efe0 50%,#dfe8de 50%,#6e97a0';
  document.getElementById('side').innerHTML = `<div class="box"><h4>Logo options · click to use</h4><div class="logos">${Object.keys(LOGOS).map(k => `<div class="${S.logo === k ? 'on' : ''}" data-logo="${k}"><div style="background:linear-gradient(${bg});display:flex;justify-content:center">${wordmark(140, sn, true, k)}</div><span>${LOGOS[k].name}</span></div>`).join('')}</div></div>
    <div class="box"><h4>App icons · ${sn}</h4><div class="row" style="align-items:flex-end;flex-wrap:wrap">${Object.keys(LOGOS).map(k => appIcon(k === S.logo ? 62 : 46, sn, k)).join('')}${appIcon(30, sn)}</div></div>
    <div class="box"><h4>The rule</h4>The app's words above the waterline, the person's below, always upright. A pond in a forest on home, a brook you walk along on a Path, a pool again at the Recap. An Inquiry is a lily: an unfinished one is a pad that yellows as its days run out, a finished one is the flower. Help and the Step-out still the water.</div>
    <div class="box"><h4>Not yet</h4>Animation is placeholder. Smooth, natural, relaxing motion is heavy work for later, as is timing that sits between snappy and calm.</div>
    <div class="box"><h4>State</h4>screen: ${S.screen}${S.path ? ' / ' + S.path + ' step ' + (S.vi + 1) : ''}${S.readAll ? ' (read it all)' : ''}<br>voice: <b>${TIER[tier()]}</b>${S.soften ? ' (model is softening)' : S.screen === 'path' ? ' (step ' + (S.vi + 1) + ' of the Path)' : ''}<br>logo: ${S.logo}<br>keyboard: ${S.kb ? 'open' : 'closed'} · season: ${sn}${S.season === 'auto' ? ' (auto)' : ''}</div>`;
}
function renderProto() {
  const sel = (p, opts, cur) => `<select data-p="${p}">${opts.map(([v, l]) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  document.getElementById('proto').innerHTML = `<span>PROTOTYPE</span>
    ${sel('season', [['auto', 'auto'], ['morning', 'morning'], ['evening', 'evening']], S.season)}
    ${sel('logo', Object.keys(LOGOS).map(k => [k, 'logo: ' + k]), S.logo)}
    <button data-p="soften" class="${S.soften ? 'on' : ''}">model: ${S.soften ? 'softening' : 'neutral'}</button>
    <button data-p="still">${S.still ? 'motion: reduced' : 'motion: on'}</button>
    ${sel('jump', [['', 'jump to…'], ['splash', 'opening'], ['home', 'home'], ['new', 'new Inquiry'], ['probes', 'Probe list'], ['path', 'a Path, writing'], ['pathmid', 'a Path, read back'], ['ended', 'an ended Path'], ['recap', 'Recap'], ['help', 'Help'], ['stepout', 'Step-out']], '')}
    <button data-p="reset">reset</button>`;
}

// ---------- water: the brook, ripples, drops, falling leaves ----------
let brookAnims = [], brookRate = 0, brookRaf = null;
function brookTo(target, ms) {
  const el = document.getElementById('creek');
  if (!brookAnims.length) brookAnims = [...el.querySelectorAll('.cur')].map(p => { const a = p.animate([{ strokeDashoffset: 0 }, { strokeDashoffset: -+p.dataset.len }], { duration: +p.dataset.ms * 6, iterations: Infinity }); a.playbackRate = 0.0001; return a; });
  if (S.still) target = 0;
  el.style.opacity = target ? '1' : '0'; el.style.transitionDuration = ms + 'ms';
  cancelAnimationFrame(brookRaf); const from = brookRate, t0 = performance.now();
  (function f(t) { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); brookRate = from + (target - from) * e;
    brookAnims.forEach(a => a.playbackRate = Math.max(brookRate, 0.0001)); if (k < 1) brookRaf = requestAnimationFrame(f); })(t0);
}
function walkBrook(vi) { // each step moves you a little way down the meander
  document.getElementById('creekg').style.transform = `translateX(${-vi * 330 - 60}px)`;
}
let rings = [], rafOn = false;
function ripple(x, y, n = 3, small) { if (S.still) return; for (let k = 0; k < n; k++) rings.push({ x, y, small, born: performance.now() + k * 260 }); if (!rafOn) { rafOn = true; requestAnimationFrame(tick); } }
function tick(t) {
  const c = document.getElementById('rip'), g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height);
  const col = getComputedStyle(document.getElementById('app')).getPropertyValue('--rip');
  const life = o => o.small ? 1100 : 2600;
  rings = rings.filter(o => t - o.born < life(o));
  for (const o of rings) { const age = t - o.born; if (age < 0) continue; const r = o.small ? 2 + age * .022 : 4 + age * .07;
    g.globalAlpha = Math.max(0, 1 - age / life(o)) * (o.small ? .6 : .9); g.strokeStyle = col; g.lineWidth = 1.2; g.beginPath(); g.ellipse(o.x, o.y, r, r * .28, 0, 0, Math.PI * 2); g.stroke(); }
  if (rings.length) requestAnimationFrame(tick); else { rafOn = false; g.clearRect(0, 0, c.width, c.height); }
}
const wlPx = () => { const a = document.getElementById('app'); return a.getBoundingClientRect().height * parseFloat(getComputedStyle(a).getPropertyValue('--wl')) / 100; };
function drop(then, x = 195) {
  const app = document.getElementById('app'), y = wlPx() + 10;
  if (S.still) return then();
  const d = document.createElement('div'); d.className = 'drop'; d.style.left = x + 'px'; app.appendChild(d);
  d.animate([{ top: '-20px' }, { top: (y - 8) + 'px' }], { duration: 650, easing: 'cubic-bezier(.5,0,1,1)' }).onfinish = () => { d.remove(); ripple(x, y); then(); };
}
function skim() { // a small flat stone skips four times down the brook, each hop shorter and quicker, then sinks
  if (S.still) return;
  const app = document.getElementById('app'), y = wlPx() + 250, x0 = 70, hops = [72, 46, 28, 15], lifts = [9, 5, 2.6, 1.2];
  const st = document.createElement('div'); st.className = 'skim'; st.style.left = x0 + 'px'; st.style.top = y + 'px'; app.appendChild(st);
  const total = hops.reduce((a, b) => a + b, 0), dur = 760, kf = [{ transform: 'translate(0,0)', offset: 0 }];
  let x = 0;
  hops.forEach((h, k) => { const at = (x + h / 2) / total, end = (x + h) / total;
    kf.push({ transform: `translate(${x + h / 2}px,${-lifts[k]}px)`, offset: at }, { transform: `translate(${x + h}px,0)`, offset: end });
    x += h; const xx = x0 + x; setTimeout(() => ripple(xx + 4, y + 3, 1, true), dur * end); });
  st.animate(kf, { duration: dur, easing: 'cubic-bezier(.15,.6,.45,1)', fill: 'forwards' }).onfinish = () =>
    st.animate([{ opacity: .9, transform: `translate(${x}px,0)` }, { opacity: 0, transform: `translate(${x + 3}px,4px)` }], { duration: 260, fill: 'forwards' }).onfinish = () => st.remove();
}
function playSplash() {
  setTimeout(() => drop(() => { const mk = document.getElementById('mark'); if (!mk) return; mk.classList.add('show'); waveDown(18, 2600); }), S.still ? 0 : 700);
}
function waveDown(from, ms) { if (S.still) return; const m = document.getElementById('wavemap'), t0 = performance.now();
  (function f(t) { const k = Math.min(1, (t - t0) / ms); m.setAttribute('scale', String(from * (1 - k))); if (k < 1) requestAnimationFrame(f); })(t0); }
let leafTimer = null;
function startLeafFall() { // now and then a leaf comes off a tree and drifts down onto the pond
  clearTimeout(leafTimer);
  leafTimer = setTimeout(function fall() {
    if (S.screen !== 'home') return;
    if (!S.still && !S.sheet) {
      const app = document.getElementById('app'), wl = wlPx(), left = Math.random() < .5;
      const x0 = left ? 20 + Math.random() * 70 : 290 + Math.random() * 70, y0 = wl - 100 + Math.random() * 40;
      const x1 = x0 + (left ? 1 : -1) * (60 + Math.random() * 90), y1 = wl + 20 + Math.random() * 50;
      const el = document.createElement('div'); el.className = 'flyer'; el.innerHTML = LEAF(14 + Math.random() * 6, Math.random() * 360, CROWNS[season()][Math.floor(Math.random() * 4)]);
      el.style.left = x0 + 'px'; el.style.top = y0 + 'px'; app.appendChild(el);
      const dx = x1 - x0, dy = y1 - y0;
      el.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: `translate(${dx * .35}px,${dy * .3}px) rotate(120deg)` }, { transform: `translate(${dx * .55}px,${dy * .55}px) rotate(60deg)` },
        { transform: `translate(${dx * .85}px,${dy * .8}px) rotate(200deg)` }, { transform: `translate(${dx}px,${dy}px) rotate(170deg) scaleY(.7)` }], { duration: 6000 + Math.random() * 2000, easing: 'ease-in-out', fill: 'forwards' })
        .onfinish = () => { ripple(x1 + 8, y1 + 6, 2); el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 4000, delay: 2500, fill: 'forwards' }).onfinish = () => el.remove(); };
    }
    leafTimer = setTimeout(fall, 3500 + Math.random() * 5000);
  }, 1200);
}

// ---------- keyboard (faked): it slides over the empty water; nothing on screen moves ----------
function setKb(on) {
  if (S.kb === on) return; S.kb = on; const app = document.getElementById('app');
  app.classList.toggle('kb', on);
  renderSide();
}
document.addEventListener('focusin', e => { if (e.target.matches('textarea.ref')) setKb(true); });
document.addEventListener('focusout', e => { if (e.target.matches('textarea.ref')) setTimeout(() => { if (!document.activeElement.matches('textarea.ref')) setKb(false); }, 60); });
document.addEventListener('mousedown', e => { if (e.target.closest('.kbd')) { e.preventDefault(); if (e.target.closest('.kbdone')) document.activeElement.blur(); } });

// ---------- actions ----------
function newToday(midway) {
  S.today = { problem: PROBLEM, status: 'live', worth: null, probes: ['p1', 'p2', 'p3', 'p4'].map(id => ({ id, status: 'open', pos: 0 })) };
  S.todayDone = true;
  if (midway) { Object.assign(S.today.probes[0], { status: 'looked', pos: 3 }); Object.assign(S.today.probes[1], { pos: 1 }); Object.assign(S.today.probes[2], { status: 'looked', pos: 2 }); }
}
function submit(kind) {
  if (S.busy) return;
  const v = (kind === 'problem' ? S.problemDraft : S.draft).trim(); if (!v) return;
  S.busy = true; if (document.activeElement) document.activeElement.blur(); S.kb = false;
  if (kind === 'problem') { render(); return drop(() => setTimeout(() => { S.busy = false; newToday(false); S.problemDraft = ''; S.screen = 'probes'; render(); }, 600)); }
  if (/hurt myself|end it|kill/i.test(v)) { S.busy = false; S.draft = ''; S.screen = 'stepout'; S.path = null; return render(); }
  const p = probe(); p.pending = v; render(); skim(); // a stone skims down the brook; the reply doesn't wait for it
  setTimeout(() => {
    const s = PS[p.id]; s.rs[p.pos] = v; p.pos++; p.pending = null; S.draft = ''; S.busy = false; S.budOpen = false;
    if (p.pos >= s.qs.length) p.status = 'looked';
    const st = steps(p); S.vi = p.status === 'looked' ? st.length : st.length - 1; S.justReplied = true; S.dir = 'next'; render();
  }, 500);
}
function go(screen, x = {}) { Object.assign(S, { screen, sheet: null, leafNote: false, readAll: false, kb: false }, x); render(); }
function jump(v) {
  Object.assign(S, { sheet: null, path: null, vi: 0, readAll: false, kb: false, leafNote: false });
  if (v === 'splash' || v === 'home') return go(v);
  if (v === 'new') { S.today = null; S.todayDone = false; return go('problem'); }
  newToday(true);
  if (v === 'probes') return go('probes');
  if (v === 'path') return go('path', { path: 'p2', vi: 1 });
  if (v === 'pathmid') return go('path', { path: 'p1', vi: 1 });
  if (v === 'ended') return go('path', { path: 'p1', vi: 3 });
  if (v === 'recap') { S.today.status = 'ended'; lastScreen = 'path'; brookTo(1, 1); return go('recap'); }
  if (v === 'help') { go('path', { path: 'p2', vi: 1 }); S.sheet = 'help'; return render(); }
  if (v === 'stepout') return go('stepout');
}

document.addEventListener('input', e => {
  const k = e.target.dataset.draft; if (!k) return;
  if (k === 'problem') S.problemDraft = e.target.value; else S.draft = e.target.value;
  document.querySelectorAll('button[data-act=submit]').forEach(b => b.disabled = !e.target.value.trim());
});
document.addEventListener('change', e => {
  const p = e.target.dataset.p;
  if (p === 'season') { S.season = e.target.value; render(); }
  if (p === 'logo') { S.logo = e.target.value; render(); }
  if (p === 'jump') jump(e.target.value);
});
document.addEventListener('click', e => {
  const lg = e.target.closest('[data-logo]'); if (lg) { S.logo = lg.dataset.logo; return render(); }
  const pb = e.target.closest('button[data-p]');
  if (pb) { const p = pb.dataset.p;
    if (p === 'still') { S.still = !S.still; brookTo(S.screen === 'path' ? 1 : 0, 300); render(); }
    if (p === 'soften') { S.soften = !S.soften; render(); }
    if (p === 'reset') { const { season, still, logo } = S; S = seed(); Object.assign(S, { season, still, logo, screen: 'home' }); render(); } return; }
  if (S.screen === 'splash' && e.target.closest('#app')) { const r = document.getElementById('app').getBoundingClientRect(); ripple(e.clientX - r.left, Math.max(wlPx() + 4, e.clientY - r.top), 2); return setTimeout(() => go('home'), S.still ? 0 : 500); }
  const el = e.target.closest('[data-act]');
  if (!el) { // a tap on open water ripples
    const a = document.getElementById('app'); if (!a.contains(e.target) || e.target.closest('textarea,.kbd,.sheet,.plain')) return;
    const r = a.getBoundingClientRect(), y = e.clientY - r.top; if (y > wlPx()) ripple(e.clientX - r.left, y, 1); return; }
  const a = el.dataset.act, kind = el.dataset.kind;
  const rippleAt = () => { const r = el.querySelector('.bobber').getBoundingClientRect(), ar = document.getElementById('app').getBoundingClientRect(); ripple(r.left - ar.left + r.width / 2, r.top - ar.top + r.height * .6, 2); };
  ({
    home: () => go('home', { path: null }), settings: () => { rippleAt(); setTimeout(() => go('settings'), 300); },
    newLeaf: () => { if (S.todayDone) { S.leafNote = !S.leafNote; return render(); } rippleAt(); setTimeout(() => go('problem'), 350); },
    resume: () => go('probes'), fill: () => { S.problemDraft = PROBLEM; render(); },
    openPath: () => { const p = inq().probes.find(x => x.id === el.dataset.pid), st = steps(p); go('path', { path: p.id, vi: p.status === 'looked' ? 0 : st.length - 1 }); },
    closePath: () => go('probes', { path: null }), readAll: () => { S.readAll = true; render(); }, closeRead: () => { S.readAll = false; render(); },
    prev: () => { S.vi = Math.max(0, S.vi - 1); S.dir = 'prev'; render(); }, next: () => { S.vi++; S.dir = 'next'; render(); },
    reveal: () => { probe().reveal = true; render(); }, offer: () => { probe().offered = el.dataset.a; S.budOpen = false; render(); }, bud: () => { S.budOpen = !S.budOpen; render(); },
    submit: () => submit(kind), finish: () => { rippleAt(); inq().status = 'ended'; setTimeout(() => go('recap'), 350); }, worth: () => { inq().worth = el.dataset.w; render(); },
    mic: () => { S.dictating = !S.dictating; if (!S.dictating) { if (kind === 'problem') S.problemDraft += (S.problemDraft ? ' ' : '') + PROBLEM; else S.draft += (S.draft ? ' ' : '') + SAMPLE; } render(); },
    help: () => { S.sheet = 'help'; render(); }, closeSheet: () => { S.sheet = null; render(); }, noop: () => {},
  }[a] || (() => {}))();
});

// swipe between steps on the Path, but not from the screen edges (the system Back gesture lives there)
let sw = null;
document.addEventListener('pointerdown', e => { const a = document.getElementById('app'), r = a.getBoundingClientRect(), x = e.clientX - r.left;
  if (S.screen === 'path' && !S.readAll && a.contains(e.target) && !e.target.closest('textarea,button') && x > 28 && x < r.width - 28) sw = { x: e.clientX, y: e.clientY }; });
document.addEventListener('pointerup', e => { if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { const b = document.querySelector(`.stepnav button[data-act=${dx < 0 ? 'next' : 'prev'}]`); if (b && !b.disabled) b.click(); } });

document.getElementById('water').innerHTML = creekSvg();
const J = new URLSearchParams(location.search).get('jump'); if (J) jump(J); else render();
</script>
