<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Look Together pond</title>
<!--
  PROTOTYPE, throwaway. Second round of "What do Look Together's look and the voice of its copy feel like?"
  (wayfinder ticket #54 on map #1), after none of prototypes/look won. Brainstorm material, not decisions.
  The idea: everything floats on one reflecting pool. One rule throughout: the app's words sit ABOVE the
  waterline (the sky), the person's words BELOW it (the reflection).
    - Opening: a still sky reflected, a drop falls, the ripples bring up "Look" above and "Together" below.
    - Home: settings is a leaf top right; New Inquiry is a leaf bottom right; the person's Inquiries float.
    - Path: each step is two halves, the app's question above and the person's Reflection below; swipe or
      use ‹ › to move between steps. "Read it all" shows the Path as a column of mirrored pairs.
    - Submitting a Reflection is a drop; the reply comes as the water settles.
    - Help and the Step-out still the pool: no motion, no metaphor.
  Keyboard handling, three ways (?kb=rise|full|after): the waterline rises; a full-screen still-water
  editor; or no halves until the step is submitted. The keyboard is faked on desktop so the clash shows.
  Jump straight to a screen with ?jump=home|new|probes|path|pathmid|ended|recap|help|stepout.
  Seasons: spring morning / autumn evening (?season=morning|evening|auto, auto by the clock).
  Voice warms the further into the Dialogue the person gets (by submitted Reflections): spare → plain → warm.
  Model replies are canned; in the real app the prompt would warm the same way.
  Everything is in memory; reload resets. Phone only; the wide-web panes aren't dressed.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @property --wl { syntax:'<percentage>'; inherits:true; initial-value:50%; }
  #app.morning { --sky1:#c9dfec; --sky2:#f7efe0; --wat1:#dfe8de; --wat2:#6e97a0; --ink:#1f2e36; --wink:#0e2a31; --mut:#5d6d72; --wmut:#2f5058;
    --glass:rgba(255,255,255,.42); --glassB:rgba(255,255,255,.6); --acc:#4f7a3a; --leaf:#7fa65a; --leafV:#4f7a3a; --drop:#ffffff; --rip:rgba(255,255,255,.75); --still:#9fbcc0; }
  #app.evening { --sky1:#1e1a32; --sky2:#c07a4c; --wat1:#6a4a44; --wat2:#14142a; --ink:#f4eadc; --wink:#f1e5d4; --mut:#cdbfae; --wmut:#cdb9a6;
    --glass:rgba(24,20,44,.42); --glassB:rgba(255,220,180,.18); --acc:#e09a5c; --leaf:#c8692e; --leafV:#7d3a17; --drop:#ffe6c8; --rip:rgba(255,214,170,.55); --still:#2a2638; }

  * { box-sizing:border-box; }
  body { margin:0; background:#b9b9b4; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; gap:24px; padding:16px 16px 150px; font:13px system-ui,sans-serif; }
  #app { --wl:50%; position:relative; overflow:hidden; width:390px; max-width:100%; height:800px; flex:none; border-radius:34px; box-shadow:0 8px 40px #0003;
    font:15px/1.5 "Inter",system-ui,sans-serif; color:var(--ink); transition:--wl .9s cubic-bezier(.4,.1,.2,1); }
  .sky { position:absolute; inset:0 0 auto 0; height:var(--wl); background:linear-gradient(var(--sky1),var(--sky2)); }
  .water { position:absolute; inset:var(--wl) 0 0 0; background:linear-gradient(var(--wat1),var(--wat2)); }
  .water::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(transparent 0 7px, rgba(255,255,255,.05) 7px 8px); }
  .wline { position:absolute; left:0; right:0; top:var(--wl); height:1px; background:var(--rip); opacity:.7; }
  #rip { position:absolute; inset:0; pointer-events:none; z-index:3; }
  .layer { position:absolute; inset:0; z-index:4; display:flex; flex-direction:column; }
  .above { height:var(--wl); display:flex; flex-direction:column; min-height:0; }
  .below { flex:1; min-height:0; display:flex; flex-direction:column; color:var(--wink); }
  .scroll { overflow-y:auto; min-height:0; flex:1; scrollbar-width:thin; scrollbar-color:var(--glassB) transparent; }
  .pad { padding:14px 22px; }
  .read { font-family:"Newsreader",Georgia,serif; }
  .mut { color:var(--mut); } .below .mut { color:var(--wmut); } .small { font-size:13px; }
  p { margin:6px 0; } h1 { font:500 26px/1.2 "Newsreader",serif; margin:4px 0 8px; }
  h3 { font:500 12px/1 "Inter",sans-serif; letter-spacing:.08em; text-transform:uppercase; margin:22px 0 10px; color:var(--mut); }
  .below h3 { color:var(--wmut); }
  button { font:inherit; cursor:pointer; color:inherit; background:var(--glass); border:1px solid var(--glassB); border-radius:22px; padding:9px 16px; backdrop-filter:blur(6px); }
  button.pri { background:var(--ink); color:var(--sky2); border-color:var(--ink); }
  #app.evening button.pri { background:var(--acc); color:#1e1a32; border-color:var(--acc); }
  button.link { background:none; border:none; padding:4px 0; backdrop-filter:none; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; }
  button:disabled { opacity:.4; }
  .row { display:flex; gap:10px; align-items:center; } .grow { flex:1; } .right { margin-left:auto; } .center { text-align:center; }
  .topbar { display:flex; align-items:center; padding:50px 16px 6px; min-height:90px; flex:none; }
  .topbar .t { flex:1; text-align:center; font-size:13px; color:var(--mut); }
  .topbar .s { width:80px; display:flex; } .topbar .s.r { justify-content:flex-end; }
  .iconbtn { background:none; border:none; padding:6px; backdrop-filter:none; }
  .help { background:none; border:none; padding:6px 2px; backdrop-filter:none; font-weight:500; font-size:14px; display:flex; gap:6px; align-items:center; }
  .help::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--acc); }
  .card { background:var(--glass); border:1px solid var(--glassB); border-radius:16px; padding:14px 16px; margin:10px 0; backdrop-filter:blur(6px); }
  .card.tap { cursor:pointer; }
  .float { animation:bob 7s ease-in-out infinite; } .float:nth-child(2n) { animation-delay:-2.5s; } .float:nth-child(3n) { animation-delay:-4.8s; }
  @keyframes bob { 50% { transform:translateY(3px) rotate(-.3deg); } }
  #app.still .float, #app.still .leafbtn { animation:none; }
  .badge { font:italic 14px "Newsreader",serif; white-space:nowrap; }

  /* leaves */
  .leafbtn { position:absolute; z-index:6; background:none; border:none; padding:0; backdrop-filter:none; display:flex; flex-direction:column; align-items:center; gap:2px; animation:drift 9s ease-in-out infinite; }
  .leafbtn span { font-size:11px; color:var(--wink); text-shadow:0 1px 3px rgba(0,0,0,.25); }
  @keyframes drift { 50% { transform:translate(-3px,2px) rotate(4deg); } }
  .leafbtn.dry svg path:first-child { fill:#a99a7c; } .leafbtn.dry { opacity:.75; }
  .leafnote { position:absolute; right:20px; bottom:120px; z-index:7; width:220px; }

  /* Path halves */
  .q { font:400 22px/1.4 "Newsreader",serif; }
  #app.kb .q { font-size:17px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .r { font:400 18px/1.5 "Newsreader",serif; }
  .under { font:italic 15px "Newsreader",serif; color:var(--wmut); margin-bottom:10px; }
  .stepnav { position:absolute; left:0; right:0; top:calc(var(--wl) - 17px); z-index:6; display:flex; align-items:center; padding:0 8px; pointer-events:none; }
  .stepnav button { pointer-events:auto; background:var(--glass); width:34px; height:34px; padding:0; border-radius:50%; }
  .dotsrow { flex:1; display:flex; justify-content:center; gap:7px; }
  .dotsrow i { width:6px; height:6px; border-radius:50%; background:var(--rip); opacity:.5; } .dotsrow i.on { opacity:1; transform:scale(1.4); }
  .dotsrow i.end { border-radius:1px; transform:rotate(45deg); }
  textarea.ref { width:100%; flex:1; min-height:80px; background:none; border:none; outline:none; resize:none; color:var(--wink); font:18px/1.5 "Newsreader",serif; padding:0; }
  textarea.ref::placeholder { color:var(--wmut); }
  .ctrl { display:flex; align-items:center; gap:10px; padding:8px 22px 26px; }
  #app.kb .ctrl { padding-bottom:10px; }
  .ailabel { font-variant:small-caps; letter-spacing:.06em; font-size:13px; }
  .mic { width:42px; height:42px; padding:0; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .mic.on { background:var(--acc); }
  svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .docked { background:var(--sky2); color:var(--ink); border-top:1px solid var(--glassB); position:absolute; left:0; right:0; bottom:0; z-index:7; padding:10px 18px 0; }
  .docked textarea.ref { color:var(--ink); min-height:60px; } .docked textarea.ref::placeholder { color:var(--mut); }
  #app.kb .docked { bottom:280px; }
  .offer { margin-top:12px; font-size:14px; }

  /* read-back: mirrored pairs */
  .pair { margin:4px 0 18px; }
  .pair .pq { font:400 17px/1.4 "Newsreader",serif; padding:0 0 8px; }
  .pair .pl { height:1px; background:var(--rip); opacity:.8; }
  .pair .pr { font:400 16px/1.5 "Newsreader",serif; padding:8px 12px 10px; background:linear-gradient(rgba(110,151,160,.35),transparent); color:inherit; }
  #app.evening .pair .pr { background:linear-gradient(rgba(106,74,68,.5),transparent); }

  .settling { filter:url(#wave); }
  .fadein { animation:fade 1.1s ease both; } @keyframes fade { from { opacity:0; transform:translateY(-6px); } }
  .rise { animation:rise 1.1s ease both; } @keyframes rise { from { opacity:0; transform:translateY(14px); } }
  .drop { position:absolute; left:50%; width:9px; height:13px; margin-left:-4px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; background:var(--drop); z-index:8; top:-20px; box-shadow:0 0 6px var(--drop); }

  /* splash */
  .mark { position:absolute; left:0; right:0; top:calc(var(--wl) - 80px); height:160px; z-index:5; display:flex; justify-content:center; }
  .mark .lk, .mark .tg { opacity:0; transition:opacity 1.4s ease; } .mark.show .lk { opacity:1; } .mark.show .tg { opacity:.6; transition-delay:.5s; }
  .hint { position:absolute; bottom:60px; left:0; right:0; text-align:center; color:var(--wmut); opacity:0; transition:opacity 1s 2.2s; z-index:5; } .mark.show ~ .hint { opacity:1; }

  /* still screens: help, step-out */
  .scrim { position:absolute; inset:0; z-index:20; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; }
  .sheet { background:var(--still); color:var(--ink); width:100%; border-radius:24px 24px 0 0; padding:18px 22px 30px; }
  #app.evening .sheet { color:var(--wink); }
  .contact { background:var(--glass); border-radius:12px; padding:12px 14px; margin:8px 0; }
  .plain { position:absolute; inset:0; z-index:20; background:var(--still); padding:90px 24px 24px; }
  #app.evening .plain { color:var(--wink); }
  .full { position:absolute; inset:0; z-index:15; background:linear-gradient(var(--wat1),var(--wat2)); color:var(--wink); display:flex; flex-direction:column; padding:56px 22px 290px; }

  .kbd { position:absolute; left:0; right:0; bottom:0; height:280px; background:#d1d3d9; z-index:30; display:none; padding:8px 4px; }
  #app.evening .kbd { background:#2b2b2f; }
  #app.kb .kbd { display:grid; grid-template-columns:repeat(10,1fr); grid-auto-rows:44px; gap:8px 5px; }
  .kbd b { background:#fff; border-radius:5px; box-shadow:0 1px 0 #888; } #app.evening .kbd b { background:#555; }
  .kbd .done { grid-column:span 3; font:500 14px system-ui; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#123; }

  /* side panel + prototype chrome */
  #side { width:300px; flex:none; color:#222; }
  #side .box { background:#f4f4f2; border-radius:12px; padding:14px; margin-bottom:12px; line-height:1.45; }
  #side h4 { margin:0 0 8px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#666; }
  @media (max-width:760px) { #side { display:none; } }
  #proto { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); background:#111; color:#fff; border-radius:16px; padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font:12px/1.3 ui-monospace,Menlo,monospace; z-index:100; box-shadow:0 4px 20px #0006; max-width:calc(100vw - 24px); }
  #proto button, #proto select { background:#333; color:#fff; border:1px solid #555; border-radius:8px; padding:4px 8px; font:inherit; backdrop-filter:none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="wave"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.09" numOctaves="1" seed="3"/><feDisplacementMap id="wavemap" in="SourceGraphic" scale="0"/></filter></svg>
<div id="app"></div>
<div id="side"></div>
<div id="proto"></div>
<script>
// ---------- art ----------
const LEAF = (w, rot = 0, fill = 'var(--leaf)') => `<svg width="${w}" height="${w * .62}" viewBox="0 0 50 31" style="transform:rotate(${rot}deg)"><path d="M3 28C8 10 24 2 47 3C44 19 30 30 3 28Z" fill="${fill}"/><path d="M5 27C18 19 30 12 44 5" stroke="var(--leafV)" stroke-width="1.3" fill="none"/></svg>`;
function wordmark(w, season) { // leaf on the water; "Look" above, "Together" its reflection below
  const c = season === 'evening' ? { ink: '#f4eadc', leaf: '#c8692e', v: '#7d3a17', line: '#ffd6aa' } : { ink: '#1f2e36', leaf: '#7fa65a', v: '#4f7a3a', line: '#ffffff' };
  const leaf = `<path d="M222 78C227 66 240 61 256 62C254 72 244 79 222 78Z" fill="${c.leaf}"/><path d="M224 77C234 72 243 67 254 63" stroke="${c.v}" stroke-width="1.2" fill="none"/>`;
  return `<svg width="${w}" viewBox="0 0 300 160">
    <g class="lk"><text x="150" y="58" text-anchor="middle" font-family="Newsreader,serif" font-size="54" fill="${c.ink}">Look</text>${leaf}</g>
    <line x1="40" y1="80" x2="260" y2="80" stroke="${c.line}" stroke-opacity=".7"/>
    <g class="tg" transform="translate(0 160) scale(1 -1)" filter="url(#wave)"><text x="150" y="58" text-anchor="middle" font-family="Newsreader,serif" font-size="54" fill="${c.ink}">Together</text><g opacity=".7">${leaf}</g></g></svg>`;
}
function appIcon(s, season) {
  const e = season === 'evening', id = 'g' + s + season;
  return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><defs><linearGradient id="${id}s" x2="0" y2="1"><stop offset="0" stop-color="${e ? '#1e1a32' : '#c9dfec'}"/><stop offset="1" stop-color="${e ? '#c07a4c' : '#f7efe0'}"/></linearGradient>
    <linearGradient id="${id}w" x2="0" y2="1"><stop offset="0" stop-color="${e ? '#6a4a44' : '#dfe8de'}"/><stop offset="1" stop-color="${e ? '#14142a' : '#6e97a0'}"/></linearGradient><clipPath id="${id}c"><rect width="100" height="100" rx="22"/></clipPath></defs>
    <g clip-path="url(#${id}c)"><rect width="100" height="56" fill="url(#${id}s)"/><rect y="56" width="100" height="44" fill="url(#${id}w)"/>
    <path d="M26 56C33 38 52 30 76 31C73 46 58 57 26 56Z" fill="${e ? '#c8692e' : '#7fa65a'}"/><path d="M26 56C33 74 52 82 76 81C73 66 58 55 26 56Z" fill="${e ? '#c8692e' : '#7fa65a'}" opacity=".35"/>
    <line x1="0" y1="56" x2="100" y2="56" stroke="#fff" stroke-opacity=".6"/></g></svg>`;
}
const IC = { back: '<path d="M15 5l-7 7 7 7"/>', l: '<path d="M15 5l-7 7 7 7"/>', r: '<path d="M9 5l7 7-7 7"/>', mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  stop: '<rect x="7" y="7" width="10" height="10"/>', more: '<circle cx="5" cy="12" r=".7"/><circle cx="12" cy="12" r=".7"/><circle cx="19" cy="12" r=".7"/>' };
const ic = k => `<svg class="i" viewBox="0 0 24 24">${IC[k]}</svg>`;

// ---------- voice: spare → plain → warm, by how far into the Dialogue the person is ----------
const tier = () => S.depth === 0 ? 0 : S.depth < 3 ? 1 : 2;
const TIER = ['spare', 'plain', 'warm'];
const V = (...a) => a[Math.min(tier(), a.length - 1)];
const W = {
  problemT: () => 'What are you facing?', problemHelp: () => 'Something to face, not fix.', problemPh: () => 'As it comes.',
  pick: () => V('Where to look first?', 'Pick one to look at.', 'Where would you like to look next?'),
  reflPh: () => V('As it comes.', 'Take your time.', 'Take all the time you need.'),
  notFit: () => V('Doesn\'t fit', 'This doesn\'t fit me', 'This doesn\'t sound like me'),
  under: () => V('Underneath:', 'Underneath this:', 'What might be underneath:'),
  sent: () => V('Sent on Submit.', 'Nothing is sent until you tap Submit.', 'Nothing goes anywhere until you tap Submit.'),
  ended: () => V('Ended. Read only.', 'This Path has ended. You can read it back.', 'This Path has ended. It\'s here whenever you want to read it back.'),
  finish: () => V('Go on, or finish.', 'You can keep going, or finish here.', 'You can keep going, or let it rest and finish here.'),
  waiting: () => V('…', 'Letting it settle…', 'Letting that settle for a moment…'),
  outcome: o => ({ challenged: 'you questioned this', rejected: 'this wasn\'t yours', unchallenged: 'left as it was' })[o],
};

// ---------- data ----------
const PS = {
  p1: { probe: 'What would happen if you said no the next time?', premise: 'Saying no would cost me something I can\'t afford.',
        qs: ['When you picture saying no, what exactly do you see happening?', 'Is that something you have seen happen, or something you expect?', 'What is it like to look at that expectation, rather than at the request?'],
        rs: ['I imagine my manager going quiet and giving the good projects to someone else.', 'Honestly, I expect it. I have never actually tested it.', 'It feels smaller. Like a story I keep telling.'], outcome: 'challenged', quote: 'I have never actually tested it.' },
  p2: { probe: 'Whose resentment is it, when you resent everyone?', premise: 'Other people cause my resentment.',
        qs: ['When the resentment comes, where is your attention: on them, or on what you agreed to?', 'If no one had asked, would the resentment be there?'],
        rs: ['On them. On how they just assume I\'ll do it.', 'Maybe not. But I was the one who said yes.'], outcome: 'rejected', quote: 'I was the one who said yes.',
        offer: 'There might be another belief here: that being useful is what makes you worth keeping. Add it as a Probe?' },
  p3: { probe: 'Is wanting to be liked the same as wanting to be kind?', premise: 'Being agreeable is the same as being kind.',
        qs: ['When you say yes and resent it, is that kindness?', 'What would kindness look like here, if not agreeing?'], rs: ['No. It feels more like fear dressed up.', 'I don\'t know. Maybe telling the truth about my week.'], outcome: 'unchallenged', openq: 'What is kindness, when it isn\'t agreeing?' },
  p4: { probe: 'What do you mean by things you don\'t want to do?', premise: 'I know clearly what I want and don\'t want.',
        qs: ['Name one. What makes it unwanted?', 'Did you know that before you said yes, or only after?'], rs: ['The Friday reporting. It eats my evening.', 'Only after, mostly.'], outcome: 'challenged', quote: 'Only after, mostly.' },
};
const PROBLEM = 'I keep saying yes to things at work I don\'t want to do, and then I resent everyone.';
const SAMPLE = 'I think I\'m scared that if I stop being the reliable one, nobody will need me.';
function seed() {
  const q = new URLSearchParams(location.search);
  return { season: q.get('season') || 'auto', kbMode: ['rise', 'full', 'after'].includes(q.get('kb')) ? q.get('kb') : 'rise', still: false,
    screen: 'splash', path: null, vi: 0, readAll: false, sheet: null, full: false, kb: false, depth: 0, draft: '', problemDraft: '', dictating: false, busy: false, leafNote: false, helpUsed: false,
    today: null, todayDone: false,
    unfinished: [{ problem: 'I\'m always tired and I don\'t know why.', days: 5 }, { problem: 'I keep putting off calling my father.', days: 2 }],
    past: [{ problem: 'I can\'t stop comparing myself to my brother.', day: 'Mon 2 Nov' }, { problem: 'I feel like I\'m wasting my life.', day: 'Thu 29 Oct' }] };
}
let S = seed();
const season = () => S.season !== 'auto' ? S.season : new Date().getHours() < 15 ? 'morning' : 'evening';
const esc = t => String(t).replace(/</g, '&lt;');
const inq = () => S.today;
const probe = () => inq().probes.find(p => p.id === S.path);
function steps(p) { const s = PS[p.id], n = p.status === 'looked' ? s.qs.length : p.pos + 1;
  return Array.from({ length: n }, (_, k) => ({ q: k === 0 ? s.probe : s.qs[k], r: k < p.pos ? s.rs[k] : null })); }

// ---------- screens: each returns { wl, above, below, extra } ----------
const topbar = (l = '', t = '', r = '') => `<div class="topbar"><div class="s">${l}</div><div class="t">${t}</div><div class="s r">${r}</div></div>`;
const backBtn = a => `<button class="iconbtn" data-act="${a}" aria-label="Back">${ic('back')}</button>`;
const helpBtn = () => `<button class="help" data-act="help">Help</button>`;
const leafColour = d => d >= 5 ? 'var(--leaf)' : d >= 3 ? '#c9a043' : '#8a5a3a'; // the leaf browns as its 7 days run out

function splash() {
  return { wl: '50%', above: '', below: '', extra: `<div class="mark" id="mark">${wordmark(300, season())}</div><p class="hint small">tap anywhere</p>` };
}
function home() {
  const live = inq() && inq().status === 'live';
  return { wl: '24%',
    above: `<div style="flex:1;display:flex;align-items:flex-end;justify-content:center;transform:translateY(42px)">${wordmark(170, season()).replace(/class="(lk|tg)"/g, 'class="$1" style="opacity:1"')}</div>`,
    below: `<div class="scroll pad" style="padding-top:56px;padding-bottom:120px">
      ${live ? `<div class="card tap float" data-act="resume"><p class="small mut" style="margin:0">Today</p><p class="read" style="font-size:18px;margin:2px 0 0">${esc(inq().problem)}</p></div>` : ''}
      <h3>Unfinished</h3>${S.unfinished.map(u => `<div class="card tap float"><div class="row" style="align-items:flex-start"><span>${LEAF(22, -20, leafColour(u.days))}</span><p class="grow" style="margin:0">${esc(u.problem)}</p><span class="badge">${u.days} days left</span></div></div>`).join('')}
      <h3>Recaps</h3>${S.past.map(p => `<div class="card tap"><p style="margin:0">${esc(p.problem)}</p><p class="small mut" style="margin:2px 0 0">${p.day}</p></div>`).join('')}</div>`,

// ---------- water: ripples, drops, settling ----------
let rings = [], rafOn = false;
function ripple(x, y, n = 3) { if (S.still) return; for (let k = 0; k < n; k++) rings.push({ x, y, r: 2, born: performance.now() + k * 260 }); if (!rafOn) { rafOn = true; requestAnimationFrame(tick); } }
function tick(t) {
  const c = document.getElementById('rip'); if (!c) { rafOn = false; return; }
  const g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height);
  const col = getComputedStyle(document.getElementById('app')).getPropertyValue('--rip');
  rings = rings.filter(o => t - o.born < 2600);
  for (const o of rings) { const age = t - o.born; if (age < 0) continue; const r = 4 + age * .07;
    g.globalAlpha = Math.max(0, 1 - age / 2600) * .9; g.strokeStyle = col; g.lineWidth = 1.2; g.beginPath(); g.ellipse(o.x, o.y, r, r * .28, 0, 0, Math.PI * 2); g.stroke(); }
  if (rings.length) requestAnimationFrame(tick); else { rafOn = false; g.clearRect(0, 0, c.width, c.height); }
}
const wlPx = () => { const a = document.getElementById('app'); return a.getBoundingClientRect().height * parseFloat(getComputedStyle(a).getPropertyValue('--wl')) / 100; };
function drop(then, x = 195) {
  const app = document.getElementById('app'), y = wlPx() + 10;
  if (S.still) return then();
  const d = document.createElement('div'); d.className = 'drop'; d.style.left = x + 'px'; app.appendChild(d);
  d.animate([{ top: '-20px' }, { top: (y - 8) + 'px' }], { duration: 650, easing: 'cubic-bezier(.5,0,1,1)' }).onfinish = () => { d.remove(); ripple(x, y); then(); };
}
function settle(el) { // a brief wobble, as if seen through water, that stills
  if (S.still || !el) return; const m = document.getElementById('wavemap'); el.classList.add('settling'); const t0 = performance.now();
  (function f(t) { const k = Math.min(1, (t - t0) / 1400); m.setAttribute('scale', String(14 * (1 - k))); if (k < 1) requestAnimationFrame(f); else el.classList.remove('settling'); })(t0);
}
function playSplash() {
  const app = document.getElementById('app');
  setTimeout(() => drop(() => { const mk = document.getElementById('mark'); if (!mk) return; mk.classList.add('show'); settleMark(mk); }), S.still ? 0 : 700);
}
function settleMark(mk) { if (S.still) return; const m = document.getElementById('wavemap'), t0 = performance.now();
  (function f(t) { const k = Math.min(1, (t - t0) / 2600); m.setAttribute('scale', String(18 * (1 - k))); if (k < 1 && document.getElementById('mark')) requestAnimationFrame(f); })(t0); }

// ---------- keyboard (faked) ----------
function setKb(on) {
  if (S.kb === on) return; S.kb = on; const app = document.getElementById('app');
  app.classList.toggle('kb', on);
  if (S.kbMode === 'rise') app.style.setProperty('--wl', on ? '26%' : S.wlBase);
  renderSide();
}
document.addEventListener('focusin', e => { if (e.target.matches('textarea.ref')) setKb(true); });
document.addEventListener('focusout', e => { if (e.target.matches('textarea.ref') && !S.full) setTimeout(() => { if (!document.activeElement.matches('textarea.ref')) setKb(false); }, 60); });
document.addEventListener('mousedown', e => { if (e.target.closest('.kbd')) { e.preventDefault(); if (e.target.closest('.kbdone')) { if (S.full) { S.full = false; S.kb = false; render(); } else document.activeElement.blur(); } } });

// ---------- actions ----------
function newToday(midway) {
  S.today = { problem: PROBLEM, status: 'live', worth: null, probes: ['p1', 'p2', 'p3', 'p4'].map(id => ({ id, status: 'open', pos: 0 })) };
  S.todayDone = true;
  if (midway) { Object.assign(S.today.probes[0], { status: 'looked', pos: 3 }); Object.assign(S.today.probes[1], { pos: 1 }); Object.assign(S.today.probes[2], { status: 'looked', pos: 2 }); S.depth = 6; }
}
function submit(kind) {
  if (S.busy) return;
  const v = (kind === 'problem' ? S.problemDraft : S.draft).trim(); if (!v) return;
  S.full = false; S.kb = false; S.busy = true; if (document.activeElement) document.activeElement.blur();
  if (kind === 'problem') { render(); return drop(() => setTimeout(() => { S.busy = false; newToday(false); S.problemDraft = ''; S.screen = 'probes'; render(); }, 600)); }
  if (/hurt myself|end it|kill/i.test(v)) { S.busy = false; S.draft = ''; S.screen = 'stepout'; S.path = null; return render(); }
  // show the Reflection settle into the lower half while the reply is awaited
  const p = probe(); p.pending = v; render();
  drop(() => setTimeout(() => {
    const s = PS[p.id]; s.rs[p.pos] = v; p.pos++; p.pending = null; S.draft = ''; S.depth++; S.busy = false;
    if (p.pos >= s.qs.length) p.status = 'looked';
    const st = steps(p); S.vi = p.status === 'looked' ? st.length : st.length - 1; S.justReplied = true; render();
  }, 700));
}
function go(screen, x = {}) { Object.assign(S, { screen, sheet: null, leafNote: false, readAll: false, full: false, kb: false }, x); render(); }
function jump(v) {
  Object.assign(S, { sheet: null, path: null, vi: 0, readAll: false, full: false, kb: false, leafNote: false });
  if (v === 'splash' || v === 'home') return go(v);
  if (v === 'new') { S.today = null; S.todayDone = false; S.depth = 0; return go('problem'); }
  newToday(true);
  if (v === 'probes') return go('probes');
  if (v === 'path') return go('path', { path: 'p2', vi: 1 });
  if (v === 'pathmid') return go('path', { path: 'p1', vi: 1 });
  if (v === 'ended') return go('path', { path: 'p1', vi: 3 });
  if (v === 'recap') { S.today.status = 'ended'; return go('recap'); }
  if (v === 'help') { go('path', { path: 'p2', vi: 1 }); S.sheet = 'help'; return render(); }
  if (v === 'stepout') return go('stepout');
}

document.addEventListener('input', e => {
  const k = e.target.dataset.draft; if (!k) return;

  const a = el.dataset.act, kind = el.dataset.kind;
  ({
    home: () => go('home', { path: null }), settings: () => go('settings'),
    newLeaf: () => { if (S.todayDone) { S.leafNote = !S.leafNote; return render(); } const r = el.getBoundingClientRect(), ar = document.getElementById('app').getBoundingClientRect(); ripple(r.left - ar.left + 38, r.top - ar.top + 30, 2); setTimeout(() => go('problem'), 350); },
    resume: () => go('probes'), fill: () => { S.problemDraft = PROBLEM; render(); },
    openPath: () => { const p = inq().probes.find(x => x.id === el.dataset.pid), st = steps(p); go('path', { path: p.id, vi: p.status === 'looked' ? 0 : st.length - 1 }); },
    closePath: () => go('probes', { path: null }), readAll: () => { S.readAll = true; render(); }, closeRead: () => { S.readAll = false; render(); },
    prev: () => { S.vi = Math.max(0, S.vi - 1); render(); }, next: () => { S.vi++; render(); },
    reveal: () => { probe().reveal = true; render(); }, offer: () => { probe().offered = el.dataset.a; render(); },
    submit: () => submit(kind), finish: () => { inq().status = 'ended'; go('recap'); }, worth: () => { inq().worth = el.dataset.w; render(); },
    openFull: () => { S.full = kind; render(); }, closeFull: () => { S.full = false; S.kb = false; render(); },
    mic: () => { S.dictating = !S.dictating; if (!S.dictating) { if (kind === 'problem') S.problemDraft += (S.problemDraft ? ' ' : '') + PROBLEM; else S.draft += (S.draft ? ' ' : '') + SAMPLE; } render(); },
    help: () => { S.sheet = 'help'; render(); }, closeSheet: () => { S.sheet = null; render(); }, noop: () => {},
  }[a] || (() => {}))();
  if (a === 'prev' || a === 'next') settle(document.querySelector('.below .r'));
});

// swipe between steps on the Path, but not from the screen edges (the system Back gesture lives there)
let sw = null;
document.addEventListener('pointerdown', e => { const a = document.getElementById('app'), r = a.getBoundingClientRect(), x = e.clientX - r.left;
  if (S.screen === 'path' && !S.readAll && a.contains(e.target) && !e.target.closest('textarea,button') && x > 28 && x < r.width - 28) sw = { x: e.clientX, y: e.clientY }; });
document.addEventListener('pointerup', e => { if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { const b = document.querySelector(`.stepnav button[data-act=${dx < 0 ? 'next' : 'prev'}]`); if (b && !b.disabled) b.click(); } });

const J = new URLSearchParams(location.search).get('jump'); if (J) jump(J); else render();
</script>
