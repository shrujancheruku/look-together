<title>Shoreline Frames</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE (throwaway, never merge): answers "What does each shoreline frame show, and how does it hold
  that screen's information?" (issue #78). The Shoreline (issue #71) with every place laid out for its
  frame, and three ways for the art to hold each screen's information, switchable with the bottom bar
  (‹ ›, arrow keys, or #a / #b / #c):
    A  Matched                  - lists stay lists; every row carries a chip of its pad, stone or flower, and pointing at either lights the other.
    B  Scenery                  - the world is a backdrop; frost columns hold everything; only the New Inquiry pad and the rowboat are touchable.
    C  Each thing in its place  - no lists: name tags on the pond, and one Probe, step or Recap card per frame, the camera moving between them.
  The device is live: tap rows, pads, stones, flowers, the rowboat and the signpost to move between screens.
  Text sits on pixel-frost panes (issue #72). The world engine is copied from prototypes/pond-world
  (prototype/pond-world) and the frost from prototypes/reading (prototype/reading). Copy is mock content.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,0..100&family=Nunito:wght@400;600;700&display=swap">
<style>
  /* Layout: a dark workbench (one committed look, not themed); the live device on the stage, the controls, world map and rule sheet in a side panel. The chrome uses an ink the scene never uses. */
  :root {
    --chrome: #15171d; --chrome-2: #20232c; --line: #343846; --bench: #0d0e12;
    --ink: #eef0f4; --muted: #a2a8b6; --accent: #e9c47e; --accent-ink: #1b1610;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bench); color: var(--ink); font-family: var(--body); overflow: hidden; }
  #app { height: 100%; display: flex; }
  #stage { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; overflow: auto; }
  #single { height: 100%; display: flex; align-items: center; justify-content: center; }
  #compare { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 22px 18px; padding: 18px 18px 96px; }
  .devWrap { display: flex; flex-direction: column; gap: 6px; }
  .devCap { font: 12px/1.35 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; max-width: 100%; }
  .devCap b { color: var(--ink); font-family: var(--body); font-weight: 700; }
  .devBox { position: relative; overflow: hidden; border-radius: 14px; outline: 1px solid var(--line); background: #000; }
  .dev { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
  .dev canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  .layer { position: absolute; inset: 0; }
  .deco, .ov.old { pointer-events: none; }
  .pane { position: absolute; top: 0; bottom: 0; overflow: hidden; }
  .pane + .pane { box-shadow: -1px 0 0 rgba(255,255,255,.22); }

  /* ---- the scene's words: the type scale from issue #58 ---- */
  .dev.spring .ov { color: #1f2f37; } .dev.autumn .ov { color: #fbeedd; }
  .ov p { margin: 0; }
  .app, .q, .rd { font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 500; }
  .wm { font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 500; font-size: 20px; }
  .q { font-size: 22px; line-height: 1.3; text-wrap: pretty; }
  .rd { font-size: 18px; line-height: 1.4; text-wrap: pretty; }
  .per { font-family: var(--body); font-size: 16px; line-height: 1.5; }
  .ctl { font: 600 14px/1.3 var(--body); }
  .cap { font: 700 12px/1.3 var(--body); letter-spacing: .07em; text-transform: uppercase; }
  .it { font-style: italic; } .dim { opacity: .78; }
  .blk { display: block; max-width: 100%; }
  button.g, .cbtn, .hit { font: inherit; color: inherit; background: none; border: 0; margin: 0; cursor: pointer; text-align: left; }
  .g { display: flex; flex-direction: column; gap: 6px; padding: 10px 13px; box-sizing: border-box; }
  .g.row { flex-direction: row; align-items: center; gap: 10px; width: 100%; }
  .g.capg { padding: 5px 13px; width: fit-content; }
  .rt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .g:focus-visible, .cbtn:focus-visible, .hit:focus-visible { outline: 2px dashed currentColor; outline-offset: 2px; }
  .chip { flex: none; width: 20px; height: 13px; }
  .card .cwl { height: 1px; background: currentColor; opacity: .3; margin-block: 2px; }
  .more { align-self: flex-end; }
  .top { position: absolute; left: 14px; right: 14px; display: flex; align-items: center; gap: 8px; }
  .top .g { padding: 6px 11px; }
  .stepper { flex-direction: row !important; align-items: center; gap: 4px !important; }
  .cbtn { padding: 2px 9px; font: 700 16px/1.2 var(--body); border-radius: 999px; }
  .cbtn[disabled] { opacity: .3; cursor: default; }
  .cbtn.walk { font: 700 14px/1.3 var(--body); outline: 1.5px solid currentColor; padding: 6px 13px; }
  .row2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .above, .col { position: absolute; left: 16px; right: 16px; max-width: 34em; margin-inline: auto; display: flex; flex-direction: column; gap: 8px; }
  .above { justify-content: flex-end; overflow: hidden; }
  .col { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding-bottom: 8px; }
  .col::-webkit-scrollbar { display: none; }
  .pin, .tag, .tip { position: absolute; transform: translateX(-50%); }
  .tag .g { padding: 5px 10px; white-space: nowrap; }
  .composer { position: absolute; left: 12px; right: 12px; max-width: 34em; margin-inline: auto; flex-direction: row !important; justify-content: space-between; align-items: center; }
  .pager { position: absolute; left: 50%; transform: translateX(-50%); flex-direction: row !important; align-items: center; gap: 8px !important; padding: 6px 10px !important; }
  .pillb { border-radius: 999px; padding: 5px 13px; outline: 1.5px solid currentColor; }
  .hit { position: absolute; border-radius: 50%; padding: 0; }
  .hit:hover { background: rgba(255,255,255,.08); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin-inline: auto; border-radius: 18px 18px 0 0; padding: 16px 20px 30px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 -6px 30px rgba(0,0,0,.25); }
  .dev.spring .sheet { background: #f4f6f1; color: #1f2f37; } .dev.autumn .sheet { background: #1d1a2e; color: #fbeedd; }
  .sheet .sh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .sheet .g { padding: 9px 2px; border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent); }
  .inset { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, rgba(255,90,90,.35) 0 6px, rgba(255,90,90,.1) 6px 12px); }
  .island { position: absolute; left: 50%; transform: translateX(-50%); background: #000; border-radius: 20px; }
  .keyart { position: absolute; border: 2px dashed var(--accent); border-radius: 4px; }

  #bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 20;
    display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: var(--chrome); border: 1px solid var(--line);
    box-shadow: 0 6px 24px rgba(0,0,0,.45); max-width: calc(100% - 24px); }
  #bar button { font: 600 14px/1 var(--body); color: var(--ink); background: transparent; border: 0; border-radius: 999px; padding: 10px 12px; cursor: pointer; }
  #bar button:hover, #bar button:focus-visible { background: var(--chrome-2); outline: none; }

  #bar #panelBtn { background: var(--accent); color: var(--accent-ink); }

  .pchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .pchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pchip i { font-style: normal; opacity: .65; margin-left: 4px; font-weight: 400; }
  #mapWrap { overflow-x: auto; }
  #map { display: block; border-radius: 6px; }
  #stats { font: 12px/1.6 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: pre-wrap; margin: 0; }
  #rules { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.5; color: var(--muted); }

  @media (max-width: 820px) {
    #app { display: block; }

  }
  @media (min-width: 821px) { #panelBtn { display: none; } }

<script>
"use strict";
// ================= engine: pure, no DOM =================
// ---------- palette: the chosen kit (issue #70), 12-step full colour, sky 16 ----------
const RAMPS = ["sky", "cloud", "far", "leafA", "leafB", "leafC", "trunk", "grass", "water", "glint", "light", "pad", "flower", "mist", "stone"];
const R = Object.fromEntries(RAMPS.map((n, i) => [n, i]));
const PAL = { steps: 12, sky: 16, chroma: 1, hue: 1 };
const SEASONS = {
  spring: { name: "Spring morning", ramps: {
      sky: { L: [.72, .95], C: [.09, .03], H: [238, 205], fixed: 1 }, cloud: { L: [.80, .99], C: [.035, .008], H: [245, 250], fixed: 1 },
      far: { L: [.62, .76], C: [.05, .04], H: [205, 175] }, leafA: { L: [.36, .80], C: [.08, .14], H: [170, 118] },
      leafB: { L: [.56, .93], C: [.09, .06], H: [352, 380] }, leafC: { L: [.48, .86], C: [.10, .15], H: [150, 108] },
      trunk: { L: [.30, .52], C: [.05, .06], H: [25, 55] }, grass: { L: [.42, .82], C: [.09, .15], H: [160, 112] },
      water: { L: [.52, .80], C: [.06, .05], H: [232, 205], fixed: 1 }, glint: { L: [.86, 1], C: [.03, .005], H: [220, 95], fixed: 1 },
      light: { L: [.86, .99], C: [.05, .03], H: [85, 95], fixed: 1 }, pad: { L: [.38, .80], C: [.09, .15], H: [165, 118] },
      flower: { L: [.62, .95], C: [.11, .05], H: [350, 375] }, mist: { L: [.90, .97], C: [.015, .01], H: [230, 220], fixed: 1 },
      stone: { L: [.40, .84], C: [.02, .03], H: [250, 215] } },
    refl: { L: .70, mix: .22, dark: .02 }, moon: false,
    ink: "#1f2f37", halo: "rgba(246,251,255,.9)", inkBelow: "#1c2a33" },
  autumn: { name: "Autumn evening", ramps: {
      sky: { L: [.24, .80], C: [.07, .13], H: [285, 415], fixed: 1 }, cloud: { L: [.42, .80], C: [.09, .12], H: [320, 410] },
      far: { L: [.30, .40], C: [.05, .05], H: [300, 330] }, leafA: { L: [.38, .80], C: [.12, .16], H: [28, 72] },
      leafB: { L: [.32, .66], C: [.12, .15], H: [12, 38] }, leafC: { L: [.48, .88], C: [.10, .15], H: [58, 98] },
      trunk: { L: [.20, .38], C: [.04, .05], H: [10, 40] }, grass: { L: [.30, .66], C: [.07, .11], H: [45, 85] },
      water: { L: [.16, .34], C: [.04, .05], H: [282, 298], fixed: 1 }, glint: { L: [.72, .97], C: [.09, .03], H: [60, 92], fixed: 1 },
      light: { L: [.84, .99], C: [.06, .03], H: [85, 95], fixed: 1 }, pad: { L: [.26, .58], C: [.05, .09], H: [150, 108] },
      flower: { L: [.55, .90], C: [.10, .05], H: [345, 375] }, mist: { L: [.42, .52], C: [.03, .03], H: [300, 310], fixed: 1 },
      stone: { L: [.22, .54], C: [.02, .03], H: [300, 330] } },
    refl: { L: .25, mix: .35, dark: .06 }, moon: true,
    ink: "#fbeedd", halo: "rgba(29,23,48,.92)", inkBelow: "#f3e6d6" },
};
function oklch(L, C, h) {
  const a = C * Math.cos(h * Math.PI / 180), b = C * Math.sin(h * Math.PI / 180);
  const l_ = L + .3963377774 * a + .2158037573 * b, m_ = L - .1055613458 * a - .0638541728 * b, s_ = L - .0894841775 * a - 1.291485548 * b;
  const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
  const f = (x) => { x = Math.max(0, Math.min(1, x)); return Math.round(255 * (x <= .0031308 ? 12.92 * x : 1.055 * x ** (1 / 2.4) - .055)); };
  return [f(4.0767416621 * l - 3.3077115913 * m + .2309699292 * s), f(-1.2684380046 * l + 2.6097574011 * m - .3413193965 * s), f(-.0041960863 * l - .7034186147 * m + 1.707614701 * s)];
}
const lerp = (a, b, t) => a + (b - a) * t;
function stepsFor(name) {
  switch (name) {
    case "sky": return PAL.sky; case "glint": return 4; case "light": return 3; case "mist": return 2; case "stone": return 8;
    case "far": return PAL.steps - 2; case "trunk": return 4; default: return PAL.steps;
  }
}
const N = RAMPS.map(stepsFor);
function rampLch(spec, n) {
  const out = [], mid = (spec.H[0] + spec.H[1]) / 2;
  for (let s = 0; s < n; s++) {
    const t = n === 1 ? 1 : s / (n - 1);
    let h = lerp(spec.H[0], spec.H[1], t);
    if (!spec.fixed) h = mid + (h - mid) * PAL.hue;
    out.push([lerp(spec.L[0], spec.L[1], t), lerp(spec.C[0], spec.C[1], t) * PAL.chroma, h]);
  }
  return out;
}
function rowT([L, C, h], row) {
  if (row === "still") return [L * .88 + .07, C * .7, h];
  if (row === "stepout") return [.5 + (L - .5) * .45, C * .2, h];
  return [L, C, h];
}
const pack = ([r, g, b]) => (255 << 24 | b << 16 | g << 8 | r) >>> 0;
function makeLUT(season, row) {
  const sea = SEASONS[season], LUT = new Uint32Array(RAMPS.length * 32).fill(0xffff00ff);
  RAMPS.forEach((name, r) => rampLch(sea.ramps[name], N[r]).forEach((c, s) => {
    LUT[code(r, s)] = pack(oklch(...rowT(c, row)));
    LUT[code(r, s) + 16] = pack(oklch(...rowT([c[0] * (1 - sea.refl.mix) + sea.refl.L * sea.refl.mix - sea.refl.dark, c[1] * .75, c[2]], row)));
  }));
  return LUT;
}

// ---------- helpers ----------
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bay = (x, y) => (BAYER[(y & 3) * 4 + (x & 3)] + .5) / 16;
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash2 = (x, y, s = 0) => { let h = (x * 374761393 + y * 668265263 + s * 982451653) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };
const code = (r, s) => r * 32 + s; // +16 is the same step seen in the water
const TR = 65535;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function quant(v, n, x, y) { // rich ordered dithering, as in the chosen kit
  v = clamp(v, 0, 1) * (n - 1);
  const fl = Math.floor(v);
  return clamp(bay(x, y) < v - fl ? fl + 1 : fl, 0, n - 1);
}
const U = 1.25; // feature scale: the kit's trees at 320 art pixels across

// ---------- world building primitives ----------
function newWorld(W, H, seed) {
  return { W, H, land: new Uint16Array(W * H).fill(TR), body: new Uint8Array(W * H), bodies: [null],
    sprites: [], falls: [], glints: [], marks: [], rand: rng(seed) };
}
function farTrees(g, x0, x1, base) {
  const { W, land, rand } = g, nf = N[R.far], top = new Float32Array(W).fill(1e9);
  for (let c = x0 - 12 * U; c < x1 + 12 * U; c += (5 + rand() * 6) * U) {
    const r = (8 + rand() * 9) * U, cy = base - U * (24 + rand() * 16);
    for (let x = Math.max(x0, Math.floor(c - r)); x < Math.min(x1, c + r); x++) top[x] = Math.min(top[x], cy - Math.sqrt(Math.max(0, r * r - (x + .5 - c) ** 2)));
  }
  for (let x = x0; x < x1; x++) for (let y = Math.max(0, Math.round(top[x])); y < base; y++) {
    const d = y - top[x];
    land[y * W + x] = code(R.far, d < 1.5 ? nf - 1 : d < 6 * U ? nf - 2 : 0);
  }
}
function mist(g, x0, x1, base) {
  const { W, land } = g, c = base - 8 * U, hh = 7 * U * 1.4;
  for (let y = Math.max(0, Math.floor(c - hh)); y < base; y++) for (let x = x0; x < x1; x++) {
    const p = (1 - Math.abs(y - c) / hh);
    if (p > 0 && bay(x, y) < p && land[y * W + x] !== TR) land[y * W + x] = code(R.mist, p > .45 ? 1 : 0);
  }
}
const LEAF = [R.leafA, R.leafA, R.leafC, R.leafB];
function tree(g, cx, cy, Rr, ramp, base) {
  const { W, land, rand } = g, tw = Math.max(1, Math.round(2 * U * Math.max(1, Rr / 30))), nt = N[R.trunk];
  for (let y = Math.round(cy + Rr * .3); y < base - 2; y++) for (let x = Math.round(cx - tw / 2); x < Math.round(cx - tw / 2) + tw; x++)
    if (x >= 0 && x < W && y >= 0) land[y * W + x] = code(R.trunk, x === Math.round(cx - tw / 2) && tw > 1 ? nt - 2 : 0);
  const lobes = [{ x: cx, y: cy, r: Rr * .72, z: Rr * .15 }];
  const m = 6 + Math.floor(rand() * 3);
  for (let j = 0; j < m; j++) { const a = rand() * Math.PI * 2, d = Rr * (.35 + rand() * .25); lobes.push({ x: cx + Math.cos(a) * d * 1.15, y: cy + Math.sin(a) * d * .85, r: Rr * (.4 + rand() * .22), z: 0 }); }
  const bx = Math.floor(cx - Rr * 1.5), by = Math.floor(cy - Rr * 1.3), bw = Math.ceil(Rr * 3), bh = Math.ceil(Rr * 2.6);
  const mask = new Int16Array(bw * bh).fill(-1);
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    let best = -1, bi = -1;
    for (let li = 0; li < lobes.length; li++) { const l = lobes[li], dx = bx + x + .5 - l.x, dy = by + y + .5 - l.y, d2 = dx * dx + dy * dy; if (d2 < l.r * l.r) { const z = l.z + Math.sqrt(l.r * l.r - d2); if (z > best) { best = z; bi = li; } } }
    mask[y * bw + x] = bi;
  }
  const nl = N[ramp], inside = (x, y) => x >= 0 && y >= 0 && x < bw && y < bh && mask[y * bw + x] >= 0;
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    const li = mask[y * bw + x];

    `<b>Settings and About:</b> ${st.util === "landing" ? "a place at the left end of the world, the landing with the boathouse and a signpost (About). Opening Settings pans <i>left</i>, against the push-pans-right rule." : "a sheet over home with the camera still; About replaces the sheet's contents."}`,
    `<b>Tablets:</b> ${st.tab === "sky" ? "the waterline a fixed distance from the bottom, so extra height goes to sky, as on desktop; it never sits higher than the phone's share." : "the waterline at the phone's share of the height, so extra height is split between sky and water."}`,
    `<b>Reading mode:</b> Probes, Path and Recap run the world at half speed and thicken the frost to 72%.`,
  ]).map((x) => `<li>${x}</li>`).join("");
  renderStats(); mapKey = ""; drawMapCams();
}
function extent(filter) {
  const g = world(), saved = { ...st.page }; let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; const bumps = [];
  for (const d of DEVICES.filter(filter)) {
    const sc = scaleFor(d, g); if (sc.k !== sc.k0) bumps.push(`${d.name} ${sc.k0}→${sc.k}`);
    for (const s of SCREENS) for (let p = 0; p < pages(s); p++) {
      if (s in st.page) st.page[s] = p;
      const c = cameraFor(g, s, d, sc, true);
      x0 = Math.min(x0, c.x); x1 = Math.max(x1, c.x + sc.vw); y0 = Math.min(y0, c.y); y1 = Math.max(y1, c.y + sc.vh);
    }
  }
  Object.assign(st.page, saved);
  return { x0, x1, y0, y1, bumps };
}
function renderStats() {
  const ph = extent((d) => d.cls === "phone"), all = extent(() => true), v = views[0];
  const fmt = (e) => `x ${e.x0}…${e.x1}, y ${e.y0}…${e.y1}  → ${e.x1 - e.x0} × ${e.y1 - e.y0}`;
  const lines = [`world now  ${WORLD_W} × ${WORLD_H} art px`, `phones     ${fmt(ph)}`, `all views  ${fmt(all)}`];
  if (all.x0 < 0 || all.x1 > WORLD_W || all.y0 < 0 || all.y1 > WORLD_H) lines.push(`           views past an edge are clamped`);
  if (all.bumps.length) lines.push(`bumped     ${all.bumps.join(", ")}`);
  if (v && !st.compare && v.cam) lines.push(`this view  ${v.d.name}: x ${v.cam.x}…${v.cam.x + v.sc.vw}, y ${v.cam.y}…${v.cam.y + v.sc.vh}, waterline at ${Math.round((WY - v.cam.y) / v.sc.vh * 100)}%`);
  $("stats").textContent = lines.join("\n");
}
const mapEl = $("map"); let mapBase = null, mapKey = "";
function drawMapBase() {
  const g = G, off = document.createElement("canvas"); off.width = g.W; off.height = g.H;
  const c = off.getContext("2d"), img = c.createImageData(g.W, g.H), pix = new Uint32Array(img.data.buffer), buf = new Uint16Array(g.W * g.H);
  compose(g, 0, 0, g.W, g.H, 0, "still", buf);
  for (let i = 0; i < buf.length; i++) pix[i] = g.LUT[buf[i]];
  c.putImageData(img, 0, 0); mapBase = off; mapKey = "";
  $("mapCap").textContent = `${g.W} × ${g.H} art pixels: the landing, the pond, the lily, the brook and the pool. Accent box: this device's view. Thin boxes: every phone on this screen.`;
}
function drawMapCams() {
  if (!mapBase) return;
  const g = world(), wmax = Math.max(220, Math.min(368, $("panel").clientWidth - 32)), sc = wmax / g.W;
  const W = Math.round(g.W * sc), H = Math.round(g.H * sc), v = views[0], cam = v && !st.compare ? v.cam : null;
  const key = [W, st.v, st.season, st.screen, st.page.probes, st.page.recap, st.tab, st.util, cam && cam.x, cam && cam.y, st.device, st.compare].join();
  if (key === mapKey) return; mapKey = key;
  mapEl.width = W * 2; mapEl.height = H * 2; mapEl.style.width = W + "px"; mapEl.style.height = H + "px";
  const c = mapEl.getContext("2d"); c.setTransform(2, 0, 0, 2, 0, 0); c.imageSmoothingEnabled = true;
  c.drawImage(mapBase, 0, 0, W, H);
  c.lineWidth = .8; c.strokeStyle = "rgba(255,255,255,.55)";
  for (const d of DEVICES) if (d.cls === "phone") { const s2 = scaleFor(d, g), k = cameraFor(g, st.screen, d, s2); c.strokeRect(k.x * sc, k.y * sc, s2.vw * sc, s2.vh * sc); }
  if (cam) { c.lineWidth = 2; c.strokeStyle = "#e9c47e"; c.strokeRect(cam.x * sc, cam.y * sc, v.sc.vw * sc, v.sc.vh * sc); }
  renderStats();
}

// ================= switcher =================
const KEYS = Object.keys(VARIANTS);
function cycle(dir) { st.v = KEYS[(KEYS.indexOf(st.v) + dir + KEYS.length) % KEYS.length]; st.page = { probes: 0, recap: 0 }; history.replaceState(null, "", "#" + st.v); layout(); }
$("prev").onclick = () => cycle(-1); $("next").onclick = () => cycle(1);
$("panelBtn").onclick = () => { const p = $("panel"); p.hidden = !p.hidden; $("panelBtn").setAttribute("aria-expanded", String(!p.hidden)); };
addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1); else if (e.key === "ArrowRight") cycle(1);
});
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VARIANTS[h] && h !== st.v) { st.v = h; layout(); } });
let rT = 0; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(layout, 150); });
if (matchMedia("(max-width: 820px)").matches) { $("panel").hidden = true; $("panelBtn").setAttribute("aria-expanded", "false"); }
document.fonts.ready.then(() => { for (const v of views) v.lastKey = ""; });
layout();
requestAnimationFrame(frame);
</script>
