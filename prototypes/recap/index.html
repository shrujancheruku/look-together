<title>PROTOTYPE · Look Together Recap</title>
<!--
  PROTOTYPE, throwaway. "How does a Recap look and read?" (wayfinder ticket #60 on map #1).
  Built on the typography prototype from #58 (below), with Fraunces + Nunito and the adaptive halo fixed.
  Four Recap layouts, switchable via ?rv=A|B|C|D (or ← → / the bottom bar):
    A  Cards: one column of segmented cards (#55), then Open Questions, Not looked at yet, worth, Share.
    B  The pool: each Assumption looked at is a lily pad on still water; tap one for its card. Open Questions float as leaves.
    C  Walk round the pool: one Assumption per page with ‹ ›, like a Path, ending on what's left.
    D  A letter: the same records written out as one quiet page, templated, no model.
  ?case=full|stepout|expired|empty   which Inquiry the Recap is for (finished, stepped out, ended after 7 days, nothing finished)
  ?ow=tag|said|quiet                 how the four outcomes read     ?oq=after|top   where Open Questions sit (A only)
  ?home=list|pond                    how Recaps sit on home and reopen
  ?jump=recap (default) | home | readpath
-->
<!--
  PROTOTYPE, throwaway. "What typography does Look Together use?" (wayfinder ticket #58 on map #1).
  ROUND 2: typeface E (Fraunces + Nunito) CHOSEN, the tidy scale on by default, lily pads grow with the text up to 135%.
  The switcher (← → / ?lg=) now cycles ways to keep words legible on the sky and water:
    off · halo (round 1) · retuned colours · ink by depth · frosted wells.  ?type=A…E still swaps the typeface.
  Round 1 below:
  Five typefaces on the first-Inquiry pond prototype (#55, below), switchable via ?variant=A|B|C|D|E (← → / the bar):
    A  Newsreader + Inter (what the look prototype used)    B  Literata alone, the person in italic
    C  Atkinson Hyperlegible Next asks, Source Serif 4 answers    D  the platform's own sans, nothing bundled
    E  Fraunces (soft) + Nunito
  ?ts=0.85…2.35 simulates dynamic type (iOS xSmall to AX5); ?scale=tidy swaps the prototype's 11 sizes for 6 steps;
  ?cap=off lets lily pad labels grow with the text; ?halo=on puts a soft halo behind words on the sky and water.
  The side panel shows each role and the WCAG contrast of the text colours on the sky and water gradients.
  Start anywhere with ?jump=home|probes|path|pathmid|ended|recap (the guide's notes show on a first Inquiry).
-->
<!--
  PROTOTYPE, throwaway. "What does the guided first Inquiry say at each step?" (wayfinder ticket #55 on map #1).
  Built on the pond prototype from #54 (below). Three ways to show the same draft wording, switchable via
  ?variant=A|B|C (or ← → / the bottom bar):
    A  Inline: the explanation is a line of the screen itself, above the waterline. Gone the next time.
    B  Leaf note (CHOSEN, round 2): a note beside the thing it explains, no arrow, the rest of the screen dimmed,
       with "Got it". Round 2 also adds a welcome screen drawing a whole Inquiry, and warm intro copy.
    C  Still pool: a short card on still water before the step, with "Go on".
  ?origin=intro|splash|signin places the "inspired by" line. Start with ?jump=intro (the default) to walk the
  whole intro, sign-in and first Inquiry. Settings has "Show the guide again".
-->
<!--
  PROTOTYPE, throwaway. "What do Look Together's look and the voice of its copy feel like?" (wayfinder ticket #54
  on map #1), round 4. Brainstorm material, not decisions. Everything floats on one pool in a forest. One rule
  throughout: the app's words sit ABOVE the waterline, the person's BELOW it (always upright).
    - Opening: still sky reflected, a drop falls, the ripples bring up the wordmark.
    - Home: a pond in a forest. Trees sway and drop the odd leaf. Settings is a moored rowboat top left; the
      primary action is a flowering lily pad bottom right, its label written on the pad.
    - An Inquiry is a lily: the Problem is its pad, the Paths its stem, the Recap its flower. Each Inquiry on
      home: an unfinished one is a lily pad that yellows as its 7 days run out; a Recap is the flower alone.
    - Probe list: Probes above, the person's Problem below; Finish Inquiry is the same bottom-right lily pad.
    - Path: a meandering brook runs through the water, babbling round stones, and you walk along it step by step
      (‹ › or swipe). Submitting a Reflection skims a small stone down the brook. An offer to add a Probe floats
      as a bud on the waterline and opens when tapped. The Path never moves when the
      keyboard opens: the keyboard slides over the empty water at the bottom.
    - Recap: the brook quietens and opens into a still pool, and the lily flowers.
    - The AI notice shows once, at the start of each Inquiry (EU AI Act Art. 50); no label on every screen.
    - Help and the Step-out still the water: no motion, no metaphor.
  Logo options (?logo=lily|lilysun|lilyripples). Voice warms along the current Path and when the model signals
  softening ("model: softening" in the bar).
  ANIMATION IS PLACEHOLDER. Smooth, natural, relaxing motion is heavy work for later, as is timing that sits
  between snappy and calm.
  ?jump=home|new|probes|path|pathmid|ended|recap|help|stepout  ?season=morning|evening|auto
  Everything is in memory; reload resets. Phone only.
-->

<style>
  @property --wl { syntax:'<percentage>'; inherits:true; initial-value:50%; }
  #app.morning { --sky1:#c9dfec; --sky2:#f7efe0; --wat1:#dfe8de; --wat2:#6e97a0; --ink:#1f2e36; --wink:#0e2a31; --mut:#5d6d72; --wmut:#2f5058;
    --glass:rgba(255,255,255,.42); --glassB:rgba(255,255,255,.6); --acc:#4f7a3a; --leaf:#7fa65a; --leafV:#4f7a3a; --drop:#ffffff; --rip:rgba(255,255,255,.75); --still:#9fbcc0; --shade:rgba(20,50,60,.28);
    --creek:#f4fbf8; --pad:#5d8f45; --padR:#3f6e30; --stone:#a7aaa2; --stoneT:#c4c6bd; }
  #app.evening { --sky1:#1e1a32; --sky2:#c07a4c; --wat1:#6a4a44; --wat2:#14142a; --ink:#f4eadc; --wink:#f1e5d4; --mut:#cdbfae; --wmut:#cdb9a6;
    --glass:rgba(24,20,44,.42); --glassB:rgba(255,220,180,.18); --acc:#e09a5c; --leaf:#c8692e; --leafV:#7d3a17; --drop:#ffe6c8; --rip:rgba(255,214,170,.55); --still:#2a2638; --shade:rgba(0,0,0,.4);
    --creek:#ffd9b0; --pad:#6f6a2c; --padR:#4c4a1c; --stone:#5d5a63; --stoneT:#77737d; }

  * { box-sizing:border-box; }
  body { margin:0; background:#b9b9b4; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; gap:24px; padding:16px 16px 150px; font:calc(var(--s13,13px)*var(--ts)) system-ui,sans-serif; }
  #app { --wl:50%; position:relative; overflow:hidden; width:390px; max-width:100%; height:800px; flex:none; border-radius:34px; box-shadow:0 8px 40px #0003;
    font:calc(var(--s15,15px)*var(--ts))/1.5 var(--f-ui); color:var(--ink); transition:--wl .9s cubic-bezier(.4,.1,.2,1); }
  .sky { position:absolute; inset:0 0 auto 0; height:var(--wl); background:linear-gradient(var(--sky1),var(--sky2)); }
  .water { position:absolute; inset:var(--wl) 0 0 0; background:linear-gradient(var(--wat1),var(--wat2)); overflow:hidden; }
  .water::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(transparent 0 7px, rgba(255,255,255,.05) 7px 8px); }
  /* the brook: a meandering band with currents and babbling stones, walked along step by step */
  .creek { position:absolute; left:0; top:0; opacity:0; transition:opacity 1.6s ease; pointer-events:none; }
  #creekg { transition:transform 1.4s cubic-bezier(.4,.1,.2,1); }
  .creek .babble { transform-box:fill-box; transform-origin:center; animation:ringout 3.2s ease-out infinite; opacity:0; }
  .wline { position:absolute; left:0; right:0; top:var(--wl); height:1px; background:var(--rip); opacity:.7; }
  #rip { position:absolute; inset:0; pointer-events:none; z-index:3; }
  #ui { position:absolute; inset:0; }
  .layer { position:absolute; inset:0; z-index:4; display:flex; flex-direction:column; }
  .above { height:var(--wl); display:flex; flex-direction:column; min-height:0; }
  .below { flex:1; min-height:0; display:flex; flex-direction:column; color:var(--wink); }
  .scroll { overflow-y:auto; min-height:0; flex:1; scrollbar-width:thin; scrollbar-color:var(--glassB) transparent; }
  .pad { padding:12px 22px; }
  .read { font-family:var(--f-app); }
  .mut { color:var(--mut); } .below .mut { color:var(--wmut); } .small { font-size:calc(var(--s13,13px)*var(--ts)); }
  p { margin:6px 0; } h1 { font:500 calc(var(--s26,26px)*var(--ts))/1.2 var(--f-app); margin:4px 0 6px; }
  h3 { font:500 calc(var(--s12,12px)*var(--ts))/1 var(--f-ui); letter-spacing:.08em; text-transform:uppercase; margin:20px 0 10px; color:var(--mut); }
  .below h3 { color:var(--wmut); }
  button { font:inherit; cursor:pointer; color:inherit; background:var(--glass); border:1px solid var(--glassB); border-radius:22px; padding:9px 16px; backdrop-filter:blur(6px); }
  button.pri { background:var(--ink); color:var(--sky2); border-color:var(--ink); }
  #app.evening button.pri { background:var(--acc); color:#1e1a32; border-color:var(--acc); }
  button.link { background:none; border:none; padding:4px 0; backdrop-filter:none; text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; }
  button:disabled { opacity:.4; }
  .row { display:flex; gap:10px; align-items:center; } .grow { flex:1; } .right { margin-left:auto; } .center { text-align:center; }
  .topbar { display:flex; align-items:center; padding:46px 14px 2px; min-height:80px; flex:none; }
  .topbar .s { flex:1; display:flex; } .topbar .s.r { justify-content:flex-end; }
  .back { background:none; border:none; backdrop-filter:none; padding:6px 4px; display:flex; align-items:center; gap:2px; font-size:calc(var(--s14,14px)*var(--ts)); }
  .help { background:none; border:none; padding:6px 2px; backdrop-filter:none; font-weight:500; font-size:calc(var(--s14,14px)*var(--ts)); display:flex; gap:6px; align-items:center; }
  .help::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--acc); }
  .card { background:var(--glass); border:1px solid var(--glassB); border-radius:16px; padding:13px 16px; margin:9px 0; backdrop-filter:blur(6px); }
  .card.tap { cursor:pointer; }
  .float { animation:bob 7s ease-in-out infinite; } .float:nth-child(2n) { animation-delay:-2.5s; } .float:nth-child(3n) { animation-delay:-4.8s; }
  @keyframes bob { 50% { transform:translateY(3px) rotate(-.3deg); } }
  #app.still .float, #app.still .pobj .bobber, #app.still .pobj .ring, #app.still .sway, #app.still .creek .babble { animation:none !important; }
  .badge { font:italic calc(var(--s14,14px)*var(--ts)) var(--f-app); white-space:nowrap; }

  /* forest behind the wordmark, and its reflection */
  .trees { position:absolute; left:0; right:0; z-index:2; pointer-events:none; }
  .trees.top { top:calc(var(--wl) - 130px); height:130px; }
  .trees.refl { top:var(--wl); height:130px; transform:scaleY(-1); opacity:.22; filter:blur(1.5px); }
  .sway { transform-box:fill-box; transform-origin:50% 100%; animation:sway 6s ease-in-out infinite alternate; }
  @keyframes sway { from { transform:rotate(-1.4deg); } to { transform:rotate(1.6deg) skewX(1deg); } }
  .flyer { position:absolute; z-index:5; pointer-events:none; }

  /* things found on a pond, used as the two controls */
  .pobj { zoom:var(--tsp); position:absolute; z-index:6; background:none; border:none; padding:0; backdrop-filter:none; display:flex; flex-direction:column; align-items:center; }
  .pobj .body { position:relative; display:grid; place-items:center; }
  .pobj .bobber { position:relative; z-index:2; animation:pbob 6.5s ease-in-out infinite; display:grid; place-items:center; }
  .pobj.boat .bobber { animation-name:rock; animation-duration:5s; }
  .pobj.stones .bobber { animation:none; }
  .pobj .shadow { position:absolute; inset:35% 4% 0 8%; background:radial-gradient(ellipse at 50% 50%, var(--shade), transparent 70%); filter:blur(3px); transform:translate(2px,6px); }
  .pobj .ring { position:absolute; left:50%; top:62%; width:116%; height:50%; margin:-25% 0 0 -58%; border:1px solid var(--rip); border-radius:50%; opacity:0; animation:ringout 6s ease-out infinite; }
  .pobj .ring.r2 { animation-delay:-3s; }
  @keyframes pbob { 0%,100% { transform:translateY(0) rotate(0); } 40% { transform:translateY(1.5px) rotate(.8deg); } 75% { transform:translateY(-1px) rotate(-.6deg); } }
  @keyframes rock { 0%,100% { transform:rotate(-2deg) translateY(0); } 50% { transform:rotate(2deg) translateY(1.5px); } }
  @keyframes ringout { 0% { transform:scale(.7); opacity:.55; } 100% { transform:scale(1.7); opacity:0; } }
  .pobj .on { position:absolute; inset:0; display:grid; place-items:center; z-index:3; pointer-events:none; font:var(--w-pad) 15px/1.1 var(--f-pad); font-style:var(--st-pad); color:#fbf6ea; text-shadow:0 1px 3px rgba(0,0,0,.45); white-space:nowrap; }
  .pobj.stones .on { color:#2f2f2c; text-shadow:0 1px 0 rgba(255,255,255,.5); font-weight:600; }
  #app.evening .pobj.stones .on { color:#f2ece4; text-shadow:0 1px 0 rgba(0,0,0,.5); }
  .pobj .under { font-size:12px; color:var(--wink); text-shadow:0 1px 3px rgba(0,0,0,.25); margin-top:2px; font-style:normal; }
  .pobj.dry { opacity:.75; } .pobj.dry .ring { display:none; }
  .leafnote { position:absolute; right:20px; bottom:130px; z-index:7; width:230px; }

  /* Path halves */
  .q { font:400 calc(var(--s22,22px)*var(--ts))/1.4 var(--f-app); }
  .r { font:400 calc(var(--s18,18px)*var(--ts))/1.5 var(--f-app); }
  .premise { font:italic calc(var(--s15,15px)*var(--ts)) var(--f-app); color:var(--wmut); margin-bottom:10px; }
  .stepnav { position:absolute; left:0; right:0; top:calc(var(--wl) - 17px); z-index:6; display:flex; align-items:center; padding:0 8px; pointer-events:none; }
  .stepnav button { pointer-events:auto; background:var(--glass); width:34px; height:34px; padding:0; border-radius:50%; display:grid; place-items:center; }
  .dotsrow { flex:1; display:flex; justify-content:center; gap:7px; }
  .dotsrow i { width:6px; height:6px; border-radius:50%; background:var(--rip); opacity:.5; } .dotsrow i.on { opacity:1; transform:scale(1.4); }
  .dotsrow i.end { border-radius:1px; transform:rotate(45deg); } .dotsrow i.end.on { transform:rotate(45deg) scale(1.4); }
  .fromR { animation:fromR .7s ease both; } .fromL { animation:fromL .7s ease both; }
  @keyframes fromR { from { opacity:0; transform:translateX(28px); } } @keyframes fromL { from { opacity:0; transform:translateX(-28px); } }
  textarea.ref { width:100%; height:150px; background:none; border:none; outline:none; resize:none; color:var(--wink); font:calc(var(--s18,18px)*var(--ts))/1.5 var(--f-app); padding:0; }
  textarea.ref::placeholder { color:var(--wmut); }
  .ctrl { display:flex; align-items:center; gap:10px; padding:6px 22px 0; }
  .kbd { transform:translateY(100%); transition:transform .32s cubic-bezier(.3,.7,.3,1); display:grid !important; }
  #app.kb .kbd { transform:none; }
  .skim { position:absolute; z-index:3; width:7px; height:3px; border-radius:50%; background:#5f615b; opacity:.85; }
  .stage { flex:none; display:block; }

  .bud::after { content:""; position:absolute; left:-6px; right:-6px; bottom:-3px; height:8px; border:1px solid var(--rip); border-radius:50%; opacity:.5; }
  .budcard { position:absolute; z-index:9; right:14px; width:270px; bottom:calc(100% - var(--wl) + 34px); font-size:calc(var(--s14,14px)*var(--ts)); }
  .ailabel { font-variant:small-caps; letter-spacing:.06em; font-size:calc(var(--s13,13px)*var(--ts)); }
  .mic { width:42px; height:42px; padding:0; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .mic.on { background:var(--acc); }
  svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
  .offer { margin-top:10px; font-size:calc(var(--s14,14px)*var(--ts)); }

  .pair { margin:4px 0 18px; }

  .pair .pl { height:1px; background:var(--rip); opacity:.8; }
  .pair .pr { font:400 calc(var(--s16,16px)*var(--ts))/1.5 var(--f-app); padding:8px 12px 10px; background:linear-gradient(rgba(110,151,160,.35),transparent); }
  #app.evening .pair .pr { background:linear-gradient(rgba(106,74,68,.5),transparent); }

  .fadein { animation:fade 1.1s ease both; } @keyframes fade { from { opacity:0; transform:translateY(-6px); } }

  .mark { position:absolute; left:0; right:0; top:calc(var(--wl) - 80px); height:160px; z-index:5; display:flex; justify-content:center; }

  .scrim { position:absolute; inset:0; z-index:20; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; }

  #app.evening .sheet { color:var(--wink); }

  #app.evening .kbd { background:#2b2b2f; }

  .kbd .done { grid-column:span 3; font:500 calc(var(--s14,14px)*var(--ts)) system-ui; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#123; }
  #app.evening .kbd .done { color:#eee; }

  #side { width:320px; flex:none; color:#222; }

  #side .logos span { display:block; font-size:calc(var(--s11,11px)*var(--ts)); color:#555; padding:3px 6px; background:#fff; }
  @media (max-width:760px) { #side { display:none; } }
  /* the guide: the app's words, so always above the waterline */
  .guide { font:400 calc(var(--s15,15px)*var(--ts))/1.45 var(--f-app); color:var(--ink); border-left:2px solid var(--acc); padding:2px 0 2px 10px; margin:4px 0 10px; }
  .guide b { font-weight:500; }

  .coach { position:absolute; z-index:12; width:270px; font-size:calc(var(--s14,14px)*var(--ts)); background:rgba(255,255,255,.9) !important; color:#1f2e36; box-shadow:0 4px 18px var(--shade); }

  .coach { animation:fade .6s ease both; }
  .spot { position:absolute; z-index:11; pointer-events:none; border-radius:18px; box-shadow:0 0 0 2000px rgba(8,16,22,.5); transition:all .35s ease; }
  .coach .ttl { font:500 calc(var(--s16,16px)*var(--ts)) var(--f-app); margin:0 0 2px; }
  .gpool { position:absolute; inset:0; z-index:15; display:flex; flex-direction:column; }
  .gpool .ab { height:58%; display:flex; flex-direction:column; justify-content:flex-end; padding:0 30px 26px; background:linear-gradient(var(--sky1),var(--sky2)); }
  .gpool .bl { flex:1; background:linear-gradient(var(--wat1),var(--wat2)); border-top:1px solid var(--rip); display:flex; flex-direction:column; align-items:center; padding-top:30px; gap:10px; color:var(--wink); }
  .gpool h1 { font-size:calc(var(--s24,24px)*var(--ts)); }
  .flow { display:flex; align-items:flex-start; margin:4px -8px 0; }
  .fstep { flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; gap:2px; line-height:1.25; opacity:.22; filter:grayscale(1); transition:opacity .8s ease, filter .8s ease, transform .8s ease; }
  .fstep.lit { opacity:.75; filter:none; } .fstep.cur { opacity:1; transform:translateY(-2px); }
  .fstep .fg { height:36px; display:grid; place-items:end center; margin-bottom:4px; }
  .fstep b { font-weight:500; font-size:calc(var(--s11_5,11.5px)*var(--ts)); }
  .farrow { font-style:normal; color:var(--mut); padding-top:12px; opacity:.3; transition:opacity .8s; } .farrow.lit { opacity:.8; }
  .wglyph { position:absolute; left:0; right:0; top:calc(var(--wl) - 60px); z-index:5; display:flex; flex-direction:column; align-items:center; pointer-events:none; animation:emerge 1.2s cubic-bezier(.3,.7,.3,1) both; }
  .wglyph .wg { height:60px; display:flex; align-items:flex-end; }
  .wglyph .wr { transform:scaleY(-.6); transform-origin:top; opacity:.2; filter:blur(1.5px); }
  @keyframes emerge { from { opacity:0; transform:translateY(26px) scale(.85); } 60% { opacity:1; } }
  /* the Recap: one segment per Assumption looked at */
  .rseg { background:var(--glass); border:1px solid var(--glassB); border-radius:16px; margin:0 0 14px; overflow:hidden; backdrop-filter:blur(6px); }
  .rseg .rtop { padding:12px 16px 10px; }
  .rseg .rlab { display:flex; align-items:center; gap:8px; font-size:calc(var(--s12,12px)*var(--ts)); color:var(--wmut); margin-bottom:4px; }
  .rseg .rprobe { font:italic calc(var(--s14,14px)*var(--ts))/1.35 var(--f-app); } .rseg .chip { flex:none; white-space:nowrap; }
  .rseg .chip { border:1px solid var(--glassB); border-radius:10px; padding:1px 8px; font-size:calc(var(--s11_5,11.5px)*var(--ts)); }
  .rseg .rprem { font:400 calc(var(--s17,17px)*var(--ts))/1.4 var(--f-app); margin:0; }
  .rseg .rq { border-top:1px solid var(--rip); padding:10px 16px 12px; background:linear-gradient(rgba(110,151,160,.3),transparent); }
  #app.evening .rseg .rq { background:linear-gradient(rgba(106,74,68,.45),transparent); }
  .rseg .rq p { margin:0; } .rseg .rq .rlab { margin-bottom:2px; }
  .rseg .rquote { font:italic calc(var(--s16,16px)*var(--ts))/1.5 var(--f-app); }
  .rseg .rfoot { display:flex; justify-content:space-between; align-items:center; padding:0 16px 10px; }
  .rseg.left .rprem { opacity:.75; }
  /* ---------- the Recap (#60) ---------- */
  .rnote { font-size:calc(var(--s14,14px)*var(--ts)); margin:10px 0 0; }
  .rrow { display:flex; gap:8px; flex-wrap:wrap; }
  .rshare { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-top:18px; }
  /* A, round 2: each card is a small pond. The app's Probe and Assumption above its own waterline, the person's words below.
     The whole card opens the Path; a chevron sitting on the waterline says so. */
  .mc { display:block; width:100%; text-align:left; border:0; padding:0; margin:0 0 14px; background:none; color:inherit; font:inherit; position:relative; cursor:pointer; }
  .mc .up { padding:12px 44px 12px 16px; } .mc .dn { padding:11px 44px 13px 16px; }
  .mc .pr { font:italic calc(var(--s14,14px)*var(--ts))/1.35 var(--f-app); color:var(--wmut); margin:0 0 3px; }
  .mc .as { font:400 calc(var(--s18,18px)*var(--ts))/1.35 var(--f-app); margin:0; }
  .mc .me { font:400 calc(var(--s16,16px)*var(--ts))/1.5 var(--f-me); margin:0; }
  .mc .none { font:italic calc(var(--s14,14px)*var(--ts))/1.4 var(--f-ui); color:var(--wmut); margin:0; }
  .mc .oq { font:400 calc(var(--s15,15px)*var(--ts))/1.4 var(--f-app); margin:8px 0 0; display:flex; gap:8px; align-items:flex-start; }
  .mc .wl2 { position:relative; height:1px; background:var(--rip); }
  .mc .go { position:absolute; right:12px; top:-14px; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--glass); border:1px solid var(--glassB); }
  .mc .go svg { width:14px; height:14px; } .mc .mk { position:absolute; left:16px; top:-7px; }
  .mc:active .up, .mc:active .dn { filter:brightness(1.06); }
  /* mirror: a framed pond, sky-tinted above, water below */
  .c-mirror .mc { border-radius:18px; overflow:hidden; border:1px solid var(--glassB); }
  .c-mirror .mc .up { background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.28)); }
  .c-mirror .mc .dn { background:linear-gradient(rgba(110,151,160,.28),rgba(110,151,160,.1)); }
  #app.evening .c-mirror .mc .up { background:linear-gradient(rgba(255,214,170,.16),rgba(255,214,170,.07)); }
  #app.evening .c-mirror .mc .dn { background:linear-gradient(rgba(20,20,42,.35),rgba(20,20,42,.15)); }
  /* glass (round 3): thin frosted glass with a fine outline; the drops on the pond show faintly through it */
  .c-glass .mc { border-radius:18px; overflow:hidden; border:1px solid rgba(255,255,255,.5); background:rgba(255,255,255,.08);
    backdrop-filter:blur(2.5px) saturate(1.15); -webkit-backdrop-filter:blur(2.5px) saturate(1.15); box-shadow:inset 0 1px 0 rgba(255,255,255,.35); }
  #app.evening .c-glass .mc { border-color:rgba(255,220,180,.28); background:rgba(255,220,180,.04); box-shadow:inset 0 1px 0 rgba(255,220,180,.18); }
  .c-glass .mc .wl2 { opacity:.8; }
  .mc .fresh { font:calc(var(--s12,12px)*var(--ts))/1.3 var(--f-ui); color:var(--wmut); margin:0 0 3px; animation:fadein 1.2s ease .6s both; }
  /* open: no frame at all, only the waterline between the two voices, and space between pairs */
  .c-open .mc { margin-bottom:26px; } .c-open .mc .up, .c-open .mc .dn { padding-left:0; }
  .c-open .mc .wl2 { opacity:.9; }
  /* B: the pool */
  .pool { position:relative; padding:18px 18px 30px; }
  .ppad { display:flex; align-items:center; gap:10px; width:78%; margin:0 0 18px; background:none; border:0; padding:0; text-align:left; color:inherit; cursor:pointer; }
  .ppad:nth-child(even) { margin-left:auto; flex-direction:row-reverse; text-align:right; }
  .ppad .pg { flex:none; position:relative; }
  .ppad .pg .fl { position:absolute; left:50%; top:-8px; transform:translateX(-50%); }
  .ppad .pt { font:400 calc(var(--s16,16px)*var(--ts))/1.35 var(--f-app); }
  .ppad .pt small { display:block; font:calc(var(--s12,12px)*var(--ts)) var(--f-ui); color:var(--wmut); margin-top:2px; }
  .pleaf { display:flex; gap:10px; align-items:flex-start; margin:8px 0 14px; }
  .pbuds { display:flex; gap:14px; flex-wrap:wrap; margin-top:6px; }
  .pbuds button { background:none; border:0; padding:4px; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--wmut); font-size:calc(var(--s12,12px)*var(--ts)); }
  .rsheet { position:absolute; left:12px; right:12px; bottom:18px; z-index:21; }
  .rsheet .rseg { background:var(--still); backdrop-filter:none; }
  .rscrim { position:absolute; inset:0; z-index:20; background:rgba(0,0,0,.25); }
  /* C: pages */
  .rpage .pc { font-size:calc(var(--s12,12px)*var(--ts)); }
  .rpage .bigq { font:400 calc(var(--s22,22px)*var(--ts))/1.35 var(--f-app); margin:6px 0 0; }
  /* D: a letter */
  .letter p { font:400 calc(var(--s16,16px)*var(--ts))/1.6 var(--f-app); margin:0 0 14px; }
  .letter .me { font-family:var(--f-me); }
  .letter .sig { font-size:calc(var(--s12,12px)*var(--ts)); color:var(--wmut); }
  /* home: Recaps as flowers on the pond */
  .hflower { position:absolute; z-index:4; background:none; border:0; padding:0; display:flex; flex-direction:column; align-items:center; gap:2px; width:110px; color:var(--wink); text-align:center; cursor:pointer; }
  .hflower span { font-size:calc(var(--s12,12px)*var(--ts)); line-height:1.25; }
  .hflower .d { color:var(--wmut); }
  .signbtn { width:100%; margin:5px 0; padding:12px; }
  #side .gl { padding:6px 8px; border-radius:8px; margin:2px 0; font-size:calc(var(--s12_5,12.5px)*var(--ts)); } #side .gl.cur { background:#e3eedb; } #side .gl.done { opacity:.5; }
  #side .gl b { display:block; font-size:calc(var(--s11,11px)*var(--ts)); letter-spacing:.04em; text-transform:uppercase; color:#666; }
  #proto { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); background:#111; color:#fff; border-radius:16px; padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font:calc(var(--s12,12px)*var(--ts))/1.3 ui-monospace,Menlo,monospace; z-index:100; box-shadow:0 4px 20px #0006; max-width:calc(100vw - 24px); }
  #proto button, #proto select { background:#333; color:#fff; border:1px solid #555; border-radius:8px; padding:4px 8px; font:inherit; }
  #proto button.on { background:#6a5; border-color:#8c7; }
  /* ---------- typography (#58): roles, set per variant ---------- */
  :root { --ts:1; --tsp:1; }
  .typo { --f-app:"Newsreader",Georgia,serif; --f-me:var(--f-app); --f-ui:"Inter",system-ui,sans-serif; --f-pad:var(--f-ui); --f-mark:var(--f-app);
    --w-pad:600; --st-pad:normal; --w-mark:400; --st-me:normal; --w-me:400; }
  #app .r, #app textarea.ref, #app .pair .pr, #app .rseg .rquote, #app .me { font-family:var(--f-me); font-style:var(--st-me); font-weight:var(--w-me); }
  /* B: one serif, two voices: the app upright, the person in italic */
  .typo.t-B { --f-app:"Literata",Georgia,serif; --f-ui:var(--f-app); --st-me:italic; --st-pad:italic; --w-pad:500; }
  #app.t-B h3 { text-transform:none; font-variant:small-caps; letter-spacing:.06em; font-family:var(--f-app); }
  /* C: the app asks in a hyperlegible sans, the person answers in a serif */
  .typo.t-C { --f-app:"Atkinson Hyperlegible Next",system-ui,sans-serif; --f-ui:var(--f-app); --f-me:"Source Serif 4",Georgia,serif; --f-mark:var(--f-me); }
  /* D: the platform's own sans (SF Pro / Roboto), nothing bundled; the app's words a weight heavier */
  .typo.t-D { --f-app:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; --f-ui:var(--f-app); --w-mark:300; }
  #app.t-D .q, #app.t-D h1, #app.t-D .pair .pq, #app.t-D .rseg .rprem { font-weight:600; letter-spacing:-.01em; }
  /* E: soft and round: a soft serif for the app, a rounded sans for the person and the controls */
  .typo.t-E { --f-app:"Fraunces",Georgia,serif; --f-ui:"Nunito",system-ui,sans-serif; --f-me:var(--f-ui); --w-pad:700; font-variation-settings:"SOFT" 100,"WONK" 0; }
  .typo.t-E .me, .typo.t-E .r, .typo.t-E textarea.ref, .typo.t-E .pr, .typo.t-E .rquote { font-variation-settings:normal; }
  /* a tidy scale: six steps (12 caption, 14 control, 16 body, 18 reading, 22 question, 28 title) instead of the prototype's eleven */
  #app.tidy { --s11:12px; --s11_5:12px; --s12_5:12px; --s13:14px; --s15:16px; --s17:18px; --s19:18px; --s24:28px; --s26:28px; }
  /* ---------- legibility on the sky and water (#58, round 2) ---------- */
  /* halo: a soft glow behind every letter (round 1; didn't help much) */
  #app.lg-halo.morning .layer, #app.lg-adaptive.morning .layer { text-shadow:0 0 8px rgba(255,255,255,.6), 0 0 2px rgba(255,255,255,.5); }
  #app.lg-halo.evening .layer, #app.lg-adaptive.evening .layer { text-shadow:0 0 8px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.4); }
  /* firm halo: the same glow, stacked tight to the letters so it backs each stroke, then fading out */
  #app.morning { --haloF:0 0 1px rgba(255,252,245,.95), 0 0 3px rgba(255,252,245,.85), 0 0 7px rgba(255,252,245,.6), 0 0 16px rgba(255,252,245,.4); }
  #app.evening { --haloF:0 0 1px rgba(16,10,8,.95), 0 0 3px rgba(16,10,8,.85), 0 0 7px rgba(16,10,8,.6), 0 0 16px rgba(16,10,8,.4); }
  #app.lg-firm .layer, #app.lg-adaptive .layer [data-firm] { text-shadow:var(--haloF); }
  /* retuned: the same scene, its colours moved just far enough that every pair passes 4.5 */
  #app.lg-retuned.morning { --mut:#536165; --wat2:#8fb0b6; --wmut:#22414a; }
  #app.lg-retuned.evening { --sky2:#8f5d44; --mut:#e3d8cb; --wat1:#604441; --wmut:#d5c4b3; }
  /* well: a soft, frosted patch of sky or water colour behind each block of words */
  #app.lg-well.morning { --wellC:rgba(247,241,228,.5); } #app.lg-well.evening { --wellC:rgba(24,20,42,.5); }
  #app.lg-well .layer :is(p,h1,h3,.q,.r,.premise,textarea.ref):not(:empty):not(.card *,.pobj *,.sheet *,.coach *,.rseg *,.gpool *) {
    width:fit-content; max-width:100%; background:var(--wellC); box-shadow:0 0 28px 18px var(--wellC); border-radius:40px; }
  /* depth: each line's ink is chosen for the colour of the sky or water behind it (set by script) */
  #app.lg-depth [data-flip] { transition:color .4s; }
  #side .spec { margin:6px 0 10px; } #side .spec b { display:block; font:11px system-ui; color:#666; letter-spacing:.04em; text-transform:uppercase; }
  #side table { border-collapse:collapse; width:100%; font-size:12px; } #side td { padding:2px 4px; } #side td.bad { color:#a33; font-weight:600; } #side td.ok { color:#373; }

<body>
<svg width="0" height="0" style="position:absolute"><filter id="wave"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.09" numOctaves="1" seed="3"/><feDisplacementMap id="wavemap" in="SourceGraphic" scale="0"/></filter>
  <filter id="softwave"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.12" numOctaves="1" seed="7"/><feDisplacementMap in="SourceGraphic" scale="2.5"/></filter></svg>
<div id="app"><div class="sky"></div><div class="water" id="water"></div><div class="wline"></div><canvas id="rip" width="390" height="800"></canvas><div id="ui"></div></div>
<div id="side"></div>
<div id="proto"></div>
<script>
// ---------- art: leaves, trees, pond objects ----------
const LEAF = (w, rot = 0, fill = 'var(--leaf)') => `<svg width="${w}" height="${w * .62}" viewBox="0 0 50 31" style="transform:rotate(${rot}deg)"><path d="M3 28C8 10 24 2 47 3C44 19 30 30 3 28Z" fill="${fill}"/><path d="M5 27C18 19 30 12 44 5" stroke="var(--leafV)" stroke-width="1.3" fill="none"/></svg>`;
const CROWNS = { morning: ['#7fae5c', '#93c06a', '#5f9446', '#a9cc7a'], evening: ['#c8692e', '#d9913a', '#a4471f', '#e0b04a'] };
const TREES = [[-6, 130, 1.15, 0], [42, 130, .9, 0], [88, 130, .65, .6], [126, 130, .45, 1], [264, 130, .5, 1], [302, 130, .75, .6], [340, 130, 1.05, 0], [386, 130, .85, 0]];
function forest(sn) {
  const cs = CROWNS[sn], trunk = sn === 'evening' ? '#3a2522' : '#5a4636';
  return `<svg viewBox="0 0 390 130" width="390" height="130" preserveAspectRatio="none">${TREES.map(([x, y, s, far], n) => {
    const c = k => cs[(n + k) % cs.length], h = 62 * s, r = 24 * s;
    const blossom = sn === 'morning' && !far ? [0, 1, 2].map(k => `<circle cx="${x + (k - 1) * r * .6}" cy="${y - h - r * .6 + k * 6}" r="${2.2 * s}" fill="#f4c9d2"/>`).join('') : '';
    return `<g class="sway" style="animation-duration:${5 + (n % 3) * 1.3}s;animation-delay:-${n * .9}s;opacity:${1 - far * .45}">
      <rect x="${x - 3 * s}" y="${y - h}" width="${6 * s}" height="${h}" fill="${trunk}"/>
      <circle cx="${x}" cy="${y - h - r * .4}" r="${r}" fill="${c(0)}"/><circle cx="${x - r * .75}" cy="${y - h + r * .3}" r="${r * .8}" fill="${c(1)}"/>
      <circle cx="${x + r * .75}" cy="${y - h + r * .25}" r="${r * .85}" fill="${c(2)}"/><circle cx="${x + r * .1}" cy="${y - h - r * 1.2}" r="${r * .7}" fill="${c(3)}"/>${blossom}</g>`; }).join('')}</svg>`;
}
// a lily pad seen at an angle: a disc with its notch, squashed by perspective
const PAD_PATH = 'M50 50L94.4 38.1A46 46 0 1 0 94.4 61.9Z';
const lilyPad = (w, fill = 'var(--pad)', rim = 'var(--padR)') => `<svg width="${w}" height="${w * .46}" viewBox="0 0 100 100" preserveAspectRatio="none">
  <path d="${PAD_PATH}" fill="${fill}" stroke="${rim}" stroke-width="2.5"/>${[200, 150, 250, 110, 290].map(a => `<line x1="50" y1="50" x2="${50 + 40 * Math.cos(a * Math.PI / 180)}" y2="${50 + 40 * Math.sin(a * Math.PI / 180)}" stroke="${rim}" stroke-width="1.2" opacity=".6"/>`).join('')}</svg>`;
const lotus = (w, open) => `<svg width="${w}" height="${w * .8}" viewBox="0 0 40 32">${(open ? [-60, -30, 0, 30, 60] : [-25, 0, 25]).map(a => `<ellipse cx="20" cy="${open ? 18 : 16}" rx="5" ry="${open ? 13 : 14}" fill="#f6c3cf" stroke="#e38ba2" stroke-width=".8" transform="rotate(${a} 20 30)"/>`).join('')}${open ? '<circle cx="20" cy="24" r="3" fill="#f1cf5b"/>' : ''}</svg>`;
const rowboat = w => `<svg width="${w}" height="${w * .5}" viewBox="0 0 90 45">
  <line x1="18" y1="24" x2="2" y2="40" stroke="#6b4a2c" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="2" cy="40" rx="5" ry="2" fill="#6b4a2c"/>
  <path d="M4 16Q45 30 86 16L78 32Q45 42 12 32Z" fill="#9a6a3e"/><path d="M4 16Q45 26 86 16" stroke="#5e3a20" stroke-width="3" fill="none"/>
  <path d="M10 18Q45 28 80 18L76 22Q45 30 14 22Z" fill="#6f4628"/><rect x="40" y="20" width="10" height="4" rx="1" fill="#b5875a"/>
  <line x1="62" y1="22" x2="84" y2="38" stroke="#6b4a2c" stroke-width="2.5" stroke-linecap="round"/></svg>`;
const stone = (w, h) => `<svg width="${w}" height="${h}" viewBox="0 0 100 40" preserveAspectRatio="none"><ellipse cx="50" cy="22" rx="48" ry="17" fill="var(--stone)"/><ellipse cx="48" cy="18" rx="44" ry="13" fill="var(--stoneT)"/></svg>`;

// an Inquiry is a lily: its pad is the Problem, and it yellows as its 7 days run out; a Recap is the flower alone
const padAge = d => d >= 5 ? ['var(--pad)', 'var(--padR)'] : d >= 3 ? ['#a59a3c', '#7d7428'] : ['#8a6a3a', '#634a26'];
const padGlyph = (days = 7, w = 30) => { const [f, r] = padAge(days);
  return `<svg class="stage" width="${w}" height="${w * .62}" viewBox="0 0 100 62"><g transform="translate(2 4) scale(.96 .56)"><path d="${PAD_PATH}" fill="${f}" stroke="${r}" stroke-width="3"/></g></svg>`; };
const flowerGlyph = (w = 26) => `<svg class="stage" width="${w}" height="${w * .8}" viewBox="0 0 40 32">${[-60, -30, 0, 30, 60].map(a => `<ellipse cx="20" cy="17" rx="4.6" ry="11" fill="#f6c3cf" stroke="#e38ba2" stroke-width=".8" transform="rotate(${a} 20 28)"/>`).join('')}<circle cx="20" cy="24" r="3" fill="#f1cf5b"/></svg>`;
const budGlyph = (w = 22) => `<svg width="${w}" height="${w * 1.2}" viewBox="0 0 20 24"><path d="M10 23Q9 18 10 13" stroke="#4f7a3a" stroke-width="1.4" fill="none"/><ellipse cx="10" cy="8" rx="4.4" ry="7" fill="#f6c3cf" stroke="#e38ba2" stroke-width=".8"/><path d="M10 2Q7 8 10 14Q13 8 10 2" fill="#eea7b8" opacity=".7"/></svg>`;
function pondButton({ role, label, act, style, dry }) {
  const prim = role === 'primary', kind = 'boat';
  let obj, on = '', under = '';
  if (kind === 'stones') { obj = prim ? stone(170, 66) : stone(92, 38); on = label; }
  else if (kind === 'boat' && !prim) { obj = rowboat(78); under = label; }
  else { // lily pads; the primary one carries a lotus, closed once today's Inquiry is used
    const w = prim ? 168 : 76;
    obj = `<span style="position:relative;display:block">${lilyPad(w, dry ? '#9c8e6a' : undefined, dry ? '#7c6e4a' : undefined)}${prim && !dry ? `<span style="position:absolute;right:${w * .02}px;top:-${w * .16}px">${lotus(w * .2, true)}</span>` : ''}</span>`;
    on = prim ? label : ''; under = prim ? '' : label; }
  return `<button class="pobj ${kind} ${dry ? 'dry' : ''}" style="${style}" data-act="${act}" aria-label="${label}">
    <span class="body"><span class="ring"></span><span class="ring r2"></span><span class="shadow"></span><span class="bobber">${obj}${on ? `<span class="on" style="${prim && kind !== 'stones' ? 'padding-right:14px' : ''}">${on}</span>` : ''}</span></span>${under ? `<span class="under">${under}</span>` : ''}</button>`;
}

// ---------- logos: each draws "Look" above a waterline and "Together" upright below it ----------
const PAL = { morning: { ink: '#1f2e36', line: '#ffffff', sun: '#f0bf5e', pad: '#5d8f45', padR: '#3f6e30', rip: '#ffffff' }, evening: { ink: '#f4eadc', line: '#ffd6aa', sun: '#f6e6c8', pad: '#7d7a34', padR: '#4c4a1c', rip: '#ffd9b0' } };
const TG = (c, still) => `<g class="tg" ${still ? 'style="opacity:.62"' : ''} filter="url(#${still ? 'softwave' : 'wave'})"><text x="108" y="124" style="font-family:var(--f-mark);font-weight:var(--w-mark)" font-size="40" fill="${c.ink}">Together</text></g>`;

const wlPx = () => { const a = document.getElementById('app'); return a.getBoundingClientRect().height * parseFloat(getComputedStyle(a).getPropertyValue('--wl')) / 100; };

}
function waveDown(from, ms) { if (S.still) return; const m = document.getElementById('wavemap'), t0 = performance.now();
  (function f(t) { const k = Math.min(1, (t - t0) / ms); m.setAttribute('scale', String(from * (1 - k))); if (k < 1) requestAnimationFrame(f); })(t0); }
let leafTimer = null;

function newToday(midway) {

function welcomeStep(d) { // moves within the welcome's beats; false once past either end

}
let wheelAt = 0;

  else if ((S.screen === 'path' || (S.screen === 'recap' && S.rv === 'C')) && !S.readAll && a.contains(e.target) && !e.target.closest('textarea,button') && x > 28 && x < r.width - 28) sw = { x: e.clientX, y: e.clientY }; });

// legibility: measure every line of words on the sky and water against the gradient behind it,

const INK = { dark: hex2('#0d0906'), light: hex2('#fffbf5') }; // near black and white: where the glow is mid-tone, only these clear 4.5
function legible() {
  const app = document.getElementById('app'), cs = getComputedStyle(app), ar = app.getBoundingClientRect(), wl = ar.height * parseFloat(S.sc.wl) / 100; // where the waterline is going, not where it is mid-move
  const v = k => hex2(cs.getPropertyValue('--' + k).trim());
  const well = S.lg === 'well' ? rgb(cs.getPropertyValue('--wellC')) : null;
  const bgAt = y => { const [a, b, t] = y < wl ? ['sky1', 'sky2', y / wl] : ['wat1', 'wat2', (y - wl) / (ar.height - wl)];
    const A = v(a), B = v(b), k = Math.max(0, Math.min(1, t)), c = { r: A.r + (B.r - A.r) * k, g: A.g + (B.g - A.g) * k, b: A.b + (B.b - A.b) * k, a: 1 };

    && (el.tagName === 'TEXTAREA' || [...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())));

        lines.push({ y0, y1: Math.min(r.height, y0 + lh), k, c: score(k) }); }

      else Object.assign(el.style, { backgroundImage: `linear-gradient(to bottom, ${lines.map(l => `${css(l.k)} ${l.y0}px ${l.y1}px`).join(', ')})`,
        backgroundSize: '100% 100%', backgroundRepeat: 'no-repeat', webkitBackgroundClip: 'text', backgroundClip: 'text', color: 'transparent' });
      el.dataset.flip = 1; c = Math.min(...lines.map(l => l.c)); }
    if (S.lg === 'adaptive' && c < 4.5) el.dataset.firm = 1;
    seen.push({ c, t: (el.value || el.placeholder || el.textContent).trim().slice(0, 34) });
  }
  const box = document.getElementById('measure'); if (!box) return;
  const bad = seen.filter(x => x.c < 4.5).sort((a, b) => a.c - b.c);
  box.innerHTML = `<h4>On this screen</h4>${['halo', 'firm', 'adaptive'].includes(S.lg) ? `<p style="margin:0 0 4px;color:#555">A halo can't be measured as a ratio, so these are the gradient alone.${S.lg === 'adaptive' ? ' The lines below get the firm halo.' : ''}</p>` : ''}<b>${seen.length - bad.length} of ${seen.length}</b> lines of words on the sky and water pass 4.5 on the gradient${bad.length ? '' : ' ✓'}
    ${bad.length ? `<table style="margin-top:6px">${bad.slice(0, 5).map(x => `<tr><td>${esc(x.t)}…</td><td class="bad">${x.c.toFixed(1)}</td></tr>`).join('')}</table>` : ''}
    <p style="margin:6px 0 0;color:#555">Measured against the gradient alone; trees, the brook and glass cards aren't counted.</p>`;
}
// now and then a drop lands somewhere on the pond behind the Recap, faintly visible through the glass cards
setInterval(() => { if (S.screen !== 'recap' || S.still || S.rsel || S.rshare || document.hidden) return;
  const a = document.getElementById('app'), w = a.clientWidth, h = a.clientHeight, top = wlPx();
  ripple(30 + Math.random() * (w - 60), top + 30 + Math.random() * (h - top - 60), 2); }, 5000);
let lgRaf = 0; document.addEventListener('scroll', () => { cancelAnimationFrame(lgRaf); lgRaf = requestAnimationFrame(legible); }, true);
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycleVariant(-1); if (e.key === 'ArrowRight') cycleVariant(1);
});

document.getElementById('water').innerHTML = creekSvg();
